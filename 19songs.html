html,body{margin:0;background:#d3d3d3;font-family:Arial,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;color:#111}

function stopTTS(){
  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
  }
}

function speakChapter(c){
  if(!ttsEnabled || !('speechSynthesis' in window) || !c) return;

  stopTTS();

  const speechText = `${c.title}. ${c.text}`;
  const u = new SpeechSynthesisUtterance(speechText);

  // Hebrew by default for this file.
  u.lang=currentLanguage==='he'?'he-IL':'en-US';
  u.rate=0.92;
  u.pitch=1;
  u.volume=1;

  // Prefer a Hebrew voice when one exists.
  const voices=window.speechSynthesis.getVoices();
  const voice=voices.find(v=>currentLanguage==='he' ? /^he(-|_)/i.test(v.lang) : /^en(-|_)/i.test(v.lang));
  if(voice) u.voice=voice;

  u.onstart=()=>{
    statusEl.textContent=currentLanguage==='he'?'🔊 מקריא...':'🔊 Reading...';
  };
  u.onend=()=>{
    if(!playing) statusEl.textContent=currentLanguage==='he'?'מוכן.':'Ready.';
  };
  u.onerror=()=>{
    if(!playing) statusEl.textContent=currentLanguage==='he'?'הקראה אינה זמינה בדפדפן זה.':'TTS is not available in this browser.';
  };

  window.speechSynthesis.speak(u);
}

ttsBtn.addEventListener('click',()=>{
  ttsEnabled=!ttsEnabled;
  ttsBtn.textContent=ttsEnabled ? '🔊 TTS ON' : '🔇 TTS OFF';
  if(!ttsEnabled) stopTTS();
  else speakChapter(chapters[idx]);
});

  dragDX=e.clientX-r.left;
  dragDY=e.clientY-r.top;

  // Switch to exact left/top coordinates when dragging starts.
  menuBtn.style.left=r.left+'px';
  menuBtn.style.top=r.top+'px';
  menuBtn.style.right='auto';
  menuBtn.style.bottom='auto';

  menuBtn.setPointerCapture(e.pointerId);
  e.preventDefault();
});

menuBtn.addEventListener('pointermove',(e)=>{
  if(!menuDragging)return;

  const maxX=Math.max(0,window.innerWidth-menuBtn.offsetWidth);
  const maxY=Math.max(0,window.innerHeight-menuBtn.offsetHeight);

  const x=Math.max(0,Math.min(maxX,e.clientX-dragDX));
  const y=Math.max(0,Math.min(maxY,e.clientY-dragDY));

  if(Math.abs(x-menuBtn.offsetLeft)>3 || Math.abs(y-menuBtn.offsetTop)>3){
    menuMoved=true;
  }

  menuBtn.style.left=x+'px';
  menuBtn.style.top=y+'px';
});

function finishMenuDrag(e){
  if(!menuDragging)return;
  menuDragging=false;
  try{menuBtn.releasePointerCapture(e.pointerId);}catch(_){}
}

menuBtn.addEventListener('pointerup',finishMenuDrag);
menuBtn.addEventListener('pointercancel',finishMenuDrag);


function updateLanguageUI(){
  const he = currentLanguage==='he';

  document.documentElement.lang = he ? 'he' : 'en';
  document.documentElement.dir = he ? 'rtl' : 'ltr';

  chapters = he ? chaptersHe : chaptersEn;

  playBtn.textContent = he ? '▶ נגן הכל' : '▶ Play All';
  prevBtn.textContent = he ? '◀ הקודם' : '◀ Previous';
  nextBtn.textContent = he ? 'הבא ▶' : 'Next ▶';
  ttsBtn.textContent = ttsEnabled
    ? (he ? '🔊 הקראה פעילה' : '🔊 TTS ON')
    : (he ? '🔇 הקראה כבויה' : '🔇 TTS OFF');
  menuBtn.textContent = he ? '☰ תפריט' : '☰ Menu';
  changeBtn.textContent = he ? 'English' : 'עברית';

  textEl.style.direction = he ? 'rtl' : 'ltr';
  textEl.style.textAlign = he ? 'right' : 'left';
  titleEl.style.direction = he ? 'rtl' : 'ltr';
  chapterMenu.style.direction = he ? 'rtl' : 'ltr';

  buildChapterMenu();
  showChapter(idx);

  statusEl.textContent = he ? 'מוכן — בחר שיר.' : 'Ready — choose a song.';
}

changeBtn.addEventListener('click',()=>{
  stopTTS();
  showingLyrics=false;
  currentLanguage = currentLanguage==='he' ? 'en' : 'he';
  updateLanguageUI();
});



function formatLyricsForDisplay(raw){
  return raw || '';
}

function renderTimedLyrics(c){
  const rows=timedLyricsByNumber[String(c.n)]||[];
  textEl.innerHTML='';
  rows.forEach((row,i)=>{
    const line=document.createElement('span');
    line.className='lyric-line';
    line.dataset.lyricIndex=i;
    line.textContent=row.text;
    textEl.appendChild(line);
  });
  textEl.classList.add('lyrics-view');
  textEl.style.direction='ltr';
  textEl.style.textAlign='left';
  textEl.scrollTop=0;
}
function toggleLyrics(){
  const c=chapters[idx];
  if(!c||!timedLyricsByNumber[String(c.n)])return;
  stopTTS();
  if(!showingLyrics){
    showingLyrics=true; renderTimedLyrics(c);
    lyricsBtn.textContent=currentLanguage==='he'?'סגור מילים':'Close Lyrics';
  }else{
    showingLyrics=false; textEl.textContent=c.text;
    textEl.classList.remove('lyrics-view');
    textEl.style.direction=currentLanguage==='he'?'rtl':'ltr';
    textEl.style.textAlign=currentLanguage==='he'?'right':'left';
    lyricsBtn.textContent='Lyrics';
  }
}
lyricsBtn.addEventListener('click',toggleLyrics);

function buildChapterMenu(){
  chapterMenu.innerHTML='';
  chapters.forEach((c,i)=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='chapter-menu-item';
    b.style.direction=currentLanguage==='he'?'rtl':'ltr';
    b.style.textAlign=currentLanguage==='he'?'right':'left';
    b.textContent=c.title;
    b.dataset.index=i;
    b.addEventListener('click',()=>{
      stopPlay();
      showChapter(i);
      chapterMenu.classList.remove('open');
    });
    chapterMenu.appendChild(b);
  });
}

function updateChapterMenuActive(){
  chapterMenu.querySelectorAll('.chapter-menu-item').forEach((b,i)=>{
    b.classList.toggle('active',i===idx);
  });
}

menuBtn.addEventListener('click',(e)=>{
  if(menuMoved){
    menuMoved=false;
    e.preventDefault();
    return;
  }
  chapterMenu.classList.toggle('open');
});

document.addEventListener('click',(e)=>{
  if(!chapterMenu.contains(e.target) && e.target!==menuBtn){
    chapterMenu.classList.remove('open');
  }
});

buildChapterMenu();

function positionChapterLayout(){
  const topHalf=document.getElementById('topHalf');
  const imageBox=document.getElementById('imageBox');
  const stage=document.getElementById('stage');

  if(window.innerWidth > 700){
    const textBottom = topHalf.offsetTop + topHalf.scrollHeight;
    const gap = 30;
    const imageTop = Math.max(525, textBottom + gap);
    const imageHeight = 525;

    imageBox.style.top = imageTop + 'px';
    imageBox.style.bottom = 'auto';
    imageBox.style.height = imageHeight + 'px';
    stage.style.height = (imageTop + imageHeight) + 'px';

    noEl.style.top = (imageTop + 12) + 'px';
    capEl.style.top = (imageTop + 12) + 'px';
    return;
  }

  positionAndroidImage();
}

function positionAndroidImage(){
  if(window.innerWidth > 700) return;
  const topHalf=document.getElementById('topHalf');
  const imageBox=document.getElementById('imageBox');
  const stage=document.getElementById('stage');

  // Keep enough room for all text, then place the 400x400 image box
  // at the absolute bottom of the stage.
  const textBottom = topHalf.offsetTop + topHalf.scrollHeight;
  const gap = 20;
  const imageHeight = 400;
  const stageHeight = Math.max(920, textBottom + gap + imageHeight + 100);

  stage.style.height = stageHeight + 'px';
  imageBox.style.top = 'auto';
  imageBox.style.bottom = '200px';
  imageBox.style.height = imageHeight + 'px';

  // Put chapter number and caption at the TOP of the image.
  const imageTop = stageHeight - 200 - imageHeight;
  noEl.style.top = (imageTop + 10) + 'px';
  capEl.style.top = (imageTop + 10) + 'px';
}



const youtubeEmbed=document.getElementById('youtubeEmbed');
const embedWarning=document.getElementById('embedWarning');
const currentProtocol=document.getElementById('currentProtocol');
let loadedVideoId='',ytPlayer=null,ytReady=false,lyricSyncTimer=null,lastLyricIndex=-1;

function updateEmbedEnvironment(){
  if(currentProtocol)currentProtocol.textContent='Current page: '+location.href;
  if(location.protocol==='file:'){embedWarning.style.display='flex';youtubeEmbed.style.visibility='hidden';return false;}
  embedWarning.style.display='none';youtubeEmbed.style.visibility='visible';return true;
}
function startLyricSync(){
  if(lyricSyncTimer)clearInterval(lyricSyncTimer);
  lyricSyncTimer=setInterval(()=>{
    if(!ytReady||!ytPlayer||!showingLyrics)return;
    const rows=timedLyricsByNumber[String(chapters[idx].n)]; if(!rows)return;
    let t; try{t=ytPlayer.getCurrentTime();}catch(_){return;}
    let active=-1;
    for(let i=0;i<rows.length;i++)if(t>=rows[i].start&&t<rows[i].end){active=i;break;}
    if(active===lastLyricIndex)return;
    lastLyricIndex=active;
    textEl.querySelectorAll('.lyric-line.active').forEach(x=>x.classList.remove('active'));
    if(active>=0){
      const el=textEl.querySelector('.lyric-line[data-lyric-index="'+active+'"]');
      if(el){el.classList.add('active');textEl.scrollTo({top:Math.max(0,el.offsetTop-textEl.clientHeight*.42),behavior:'smooth'});}
    }
  },100);
}
function onYouTubeIframeAPIReady(){
  if(!updateEmbedEnvironment())return;
  const c=chapters[idx]; loadedVideoId=c.videoId;
  ytPlayer=new YT.Player('youtubeEmbed',{videoId:c.videoId,playerVars:{playsinline:1,rel:0,origin:location.origin},
    events:{onReady:()=>{ytReady=true;startLyricSync();},
    onStateChange:e=>{
      if(e.data===YT.PlayerState.PLAYING){
        const cc=chapters[idx];
        if(timedLyricsByNumber[String(cc.n)]&&!showingLyrics){
          showingLyrics=true;renderTimedLyrics(cc);
          lyricsBtn.textContent=currentLanguage==='he'?'סגור מילים':'Close Lyrics';
        }
        startLyricSync();
      }
    }}});
}
window.onYouTubeIframeAPIReady=onYouTubeIframeAPIReady;
function loadCurrentVideo(c){
  if(!c||!c.videoId||!updateEmbedEnvironment())return;
  lastLyricIndex=-1;
  if(loadedVideoId===c.videoId)return;
  loadedVideoId=c.videoId;
  if(ytReady&&ytPlayer)ytPlayer.cueVideoById(c.videoId);
}
updateEmbedEnvironment();
const ytApiScript=document.createElement('script');
ytApiScript.src='https://www.youtube.com/iframe_api';
document.head.appendChild(ytApiScript);

function showChapter(i){
  showingLyrics=false;
  textEl.classList.remove('lyrics-view');
  idx=Math.max(0,Math.min(chapters.length-1,i));
  const c=chapters[idx], s=schemeFor(idx);
  lyricsBtn.disabled=!timedLyricsByNumber[String(c.n)];
  lyricsBtn.textContent='Lyrics';
  lastLyricIndex=-1;
  bgEl.style.background=s.bg;
  titleEl.style.color=s.text;
  textEl.style.color=s.text;
  titleEl.textContent=c.title;
  textEl.textContent=c.text;
  textEl.scrollTop=0;
  capEl.textContent=c.caption||'';
  noEl.textContent=`${idx+1} / ${chapters.length}`;
  updateChapterMenuActive();
  bar.style.width='0%';
  requestAnimationFrame(positionChapterLayout);
  loadCurrentVideo(c);
  speakChapter(c);
}

function animateBar(){
  if(!playing) return;
  const p=Math.min(1,(performance.now()-startedAt)/DURATION);
  bar.style.width=(p*100)+'%';
  if(p<1) requestAnimationFrame(animateBar);
}

function stopPlay(){
  playing=false;
  stopTTS();
  if(timer) clearTimeout(timer);
  timer=null;
  statusEl.textContent='Stopped.';
}

function playAll(){
  stopPlay();
  playing=true;
  statusEl.textContent='מנגן — 7 שניות לכל Chapter';
  function step(){
    if(!playing) return;
    showChapter(idx);
    startedAt=performance.now();
    requestAnimationFrame(animateBar);
    timer=setTimeout(()=>{
      if(idx<chapters.length-1){idx++;step();}
      else{playing=false;bar.style.width='100%';statusEl.textContent='Finished.';}
    },DURATION);
  }
  step();
}

document.getElementById('playBtn').onclick=playAll;
document.getElementById('prevBtn').onclick=()=>{stopPlay();showChapter(idx-1);};
document.getElementById('nextBtn').onclick=()=>{stopPlay();showChapter(idx+1);};


function applyLanguage(lang,speak=true){
  stopTTS();
  currentLanguage=lang;
  chapters=lang==='he'?chaptersHe:chaptersEn;
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='he'?'rtl':'ltr';
  textEl.style.direction=lang==='he'?'rtl':'ltr';
  textEl.style.textAlign=lang==='he'?'right':'left';
  titleEl.style.direction=lang==='he'?'rtl':'ltr';
  capEl.style.direction=lang==='he'?'rtl':'ltr';
  document.getElementById('playBtn').textContent=lang==='he'?'▶ נגן הכל':'▶ Play All';
  document.getElementById('prevBtn').textContent=lang==='he'?'◀ הקודם':'◀ Previous';
  document.getElementById('nextBtn').textContent=lang==='he'?'הבא ▶':'Next ▶';
  menuBtn.textContent=lang==='he'?'☰ תפריט':'☰ Menu';
  buildChapterMenu();
  const was=ttsEnabled;
  if(!speak)ttsEnabled=false;
  showChapter(idx);
  ttsEnabled=was;
}
// Show first chapter silently on initial load; mobile browsers often require user interaction for speech.
ttsEnabled=false;
applyLanguage('he',false);
ttsEnabled=true;

document.addEventListener('pointerdown',()=>{
  if(!window.__ttsUserInteracted){
    window.__ttsUserInteracted=true;
  }
},{once:true});
window.addEventListener('resize', ()=>requestAnimationFrame(positionChapterLayout));
window.addEventListener('orientationchange', ()=>setTimeout(positionChapterLayout,150));




updateLanguageUI();
</script>
