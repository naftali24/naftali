<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Fixed iframe crop</title>

<style>
html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:white;
}

#iframeBox{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:50vh;
  overflow:hidden;
  background:white;
}

#iframeBox iframe{
  position:absolute;

  /* this is the permanent view position */
  top:-1080px;
  left:-100px;

  width:calc(100vw + 300px);
  height:calc(100vh + 1200px);

  border:0;
  background:white;
}

/* smartphone */
@media(max-width:700px){
  #iframeBox iframe{
    top:-500px;
    left:-155px;
    width:calc(100vw + 430px);
    height:calc(100vh + 1300px);
  }
}
</style>
</head>

<body>

<div id="iframeBox">
  <iframe
    src="https://heli-group.co.il/%D7%9E%D7%97%D7%A9%D7%91%D7%95%D7%A0%D7%99%D7%9D/"
    scrolling="no">
  </iframe>
</div>

<script>
/* lock the OUTER page */
function lockOuterPage(){
  window.scrollTo(0,0);
  document.documentElement.scrollTop = 0;
  document.body.scrollTop = 0;
}

setInterval(lockOuterPage,100);

document.addEventListener("wheel", function(e){
  e.preventDefault();
  lockOuterPage();
}, {passive:false});

document.addEventListener("touchmove", function(e){
  e.preventDefault();
  lockOuterPage();
}, {passive:false});

document.addEventListener("keydown", function(e){
  if(["ArrowUp","ArrowDown","PageUp","PageDown","Home","End"," "].includes(e.key)){
    e.preventDefault();
    lockOuterPage();
  }
});
</script>

</body>
</html>
