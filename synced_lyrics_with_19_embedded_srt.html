const lrcEl=document.getElementById('lrc');
const srtEl=document.getElementById('srt');
const statusEl=document.getElementById('status');


function selectedSongKey(){
  const item=songs[Number(songMenu.value)];
  return item.artist+' - '+item.song;
}

function loadEmbeddedSRT(){
  const key=selectedSongKey();
  const srt=embeddedSRT[key];
  if(!srt){
    srtEl.value='';
    statusEl.textContent='No embedded SRT for '+key+'.';
    return false;
  }
  srtEl.value=srt;
  statusEl.textContent='Loaded embedded SRT: '+key;
  return true;
}

document.getElementById('loadSrtBtn').onclick=loadEmbeddedSRT;

songMenu.addEventListener('change', ()=>{
  const key=selectedSongKey();
  if(embeddedSRT[key]){
    loadEmbeddedSRT();
  } else {
    srtEl.value='';
    statusEl.textContent='';
  }
});

document.getElementById('openBtn').onclick=()=>{
  const item=songs[Number(songMenu.value)];
  const q=item.artist+' '+item.song;
  const url='https://lrclib.net/search/'+encodeURIComponent(q);
  window.open(url,'_blank','noopener,noreferrer');
};

function toMs(min, sec, frac){
  const m=Number(min)||0;
  const s=Number(sec)||0;
  let f=String(frac||'0');
  if(f.length===1) f+='00';
  else if(f.length===2) f+='0';
  else f=f.slice(0,3);
  return m*60000+s*1000+Number(f);
}

function srtTime(ms){
  ms=Math.max(0,Math.round(ms));
  const h=Math.floor(ms/3600000); ms%=3600000;
  const m=Math.floor(ms/60000); ms%=60000;
  const s=Math.floor(ms/1000);
  const z=ms%1000;
  return String(h).padStart(2,'0')+':'+
         String(m).padStart(2,'0')+':'+
         String(s).padStart(2,'0')+','+
         String(z).padStart(3,'0');
}

function parseLRC(text){
  const rows=[];
  const lines=text.replace(/\r/g,'').split('\n');

  // Supports [mm:ss.xx], [mm:ss.xxx], [hh:mm:ss.xxx]
  const re=/^\s*\[(?:(\d{1,2}):)?(\d{1,3}):(\d{2})(?:[.:](\d{1,3}))?\]\s*(.*)$/;

  for(const line of lines){
    const m=line.match(re);
    if(!m) continue;

    let total;
    if(m[1]!==undefined){
      // [hh:mm:ss.xxx]
      const h=Number(m[1])||0;
      const min=Number(m[2])||0;
      const sec=Number(m[3])||0;
      let frac=String(m[4]||'0');
      if(frac.length===1) frac+='00';
      else if(frac.length===2) frac+='0';
      else frac=frac.slice(0,3);
      total=h*3600000+min*60000+sec*1000+Number(frac);
    }else{
      // [mm:ss.xxx]
      total=toMs(m[2],m[3],m[4]);
    }

    const lyric=m[5].trim();
    if(lyric) rows.push({start:total,text:lyric});
  }

  rows.sort((a,b)=>a.start-b.start);
  return rows;
}

function convert(){
  const rows=parseLRC(lrcEl.value);
  if(!rows.length){
    srtEl.value='';
    statusEl.textContent='No valid timestamped LRC lines found.';
    return;
  }

  const out=[];
  for(let i=0;i<rows.length;i++){
    const start=rows[i].start;
    // End 80ms before next line. Last caption lasts 4 seconds.
    let end=(i<rows.length-1) ? rows[i+1].start-80 : start+4000;
    if(end<=start) end=start+1200;

    out.push(
      (i+1)+'\n'+
      srtTime(start)+' --> '+srtTime(end)+'\n'+
      rows[i].text
    );
  }

  srtEl.value=out.join('\n\n');
  statusEl.textContent='Converted '+rows.length+' timed lyric lines.';
}

document.getElementById('convertBtn').onclick=convert;

document.getElementById('downloadBtn').onclick=()=>{
  if(!srtEl.value.trim()) convert();
  if(!srtEl.value.trim()) return;

  const item=songs[Number(songMenu.value)];
  const safe=(item.artist+' - '+item.song)
    .replace(/[\\/:*?"<>|]+/g,'_').trim() || 'lyrics';

  const blob=new Blob([srtEl.value],{type:'application/x-subrip;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=safe+'.srt';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{
    URL.revokeObjectURL(a.href);
    a.remove();
  },500);
};

document.getElementById('clearBtn').onclick=()=>{
  lrcEl.value='';
  srtEl.value='';
  statusEl.textContent='';
};
