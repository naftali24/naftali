<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">

<title>The Year 1900</title>
<style>
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}

body{
  margin:0;
  font-family:Arial,"Noto Sans Hebrew",sans-serif;
  background:#e8e8e8;
  color:#111;
}

.wrap{
  max-width:1150px;
  margin:auto;
  padding:18px;
}

h1{
  text-align:center;
  font-size:32px;
  margin:0px 0 16px;
}

.top{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 2px 12px #0001;
}

audio{width:100%}

.keyrow{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  margin-top:12px;
}

input{
  width:100%;
  font-size:16px;
  padding:10px;
  border:1px solid #bbb;
  border-radius:9px;
}

button,.downloadBtn{
  border:0;
  border-radius:9px;
  padding:9px 12px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

button{
  background:#333;
  color:#fff;
}

button:hover{background:#111}

.downloadBtn{
  display:inline-block;
  background:#176b3a;
  color:#fff;
  text-decoration:none;
}

.subtitle{
  margin-top:14px;
  min-height:150px;
  background:#555;
  color:#fff;
  border-radius:14px;
  padding:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:36px;
  font-weight:800;
  line-height:1.25;
  text-shadow:0 2px 5px #0009;
}

.info{
  text-align:center;
  font-weight:700;
  margin-top:8px;
}

.list{
  background:lightgray;
  border-radius:16px;
  padding:10px;
  height:500px;
  overflow-y:auto;
}

.row{
  border-bottom:1px solid #ddd;
  padding:16px 10px;
}

.row.active{background:#fff3a8}

.mainline{
  display:grid;
  grid-template-columns:auto auto 1fr;
  grid-template-rows:auto auto;
  gap:8px;
  align-items:center;
  width:100%;
  direction:ltr;
}
.mainline .text{
  grid-column:1 / -1;
  grid-row:1;
  width:100%;
}
.mainline .line-controls{
  grid-column:1;
  grid-row:2;
  justify-self:start;
}
.mainline .gpt{
  grid-column:2;
  grid-row:2;
  justify-self:start;
}

.time{display:none}

.text{
  font-size:19px;
  line-height:1.35;
  cursor:default;
  font-weight:600;
  text-align:right;
  direction:rtl;
  position:relative;
  right:15px;
  margin:0;
  padding:0;
}


.read{background:#176b3a}
.line-controls{
  display:flex;
  gap:6px;
  align-items:center;
  justify-content:flex-start;
  direction:ltr;
}

.stop{background:#8b1e1e}



.facts{
  display:none;
  margin:10px 86px 2px 0;
  background:#eef5ff;
  border-right:4px solid #315f9b;
  padding:14px;
  border-radius:8px;
  white-space:pre-wrap;
  line-height:1.3;
  font-size:20px;
  font-weight:800;
}

.facts.show{display:block}

.note{
  font-size:13px;
  color:#555;
  line-height:1.2;
  margin-top:8px;
}


/* ===== ANDROID / SMARTPHONE ===== */

@media(max-width:700px){

  html,body{
    width:100%;
    max-width:100%;
    overflow-x:hidden;
  }

  .wrap,
  .top,
  .list,
  .row,
  .mainline,
  .text,
  .facts,
  .chatbar,
  .legacyPanel,
  .legacyFrame{
    max-width:100%;
    min-width:0;
  }

  .text{
    position:relative;
    right:0 !important;
    left:auto !important;
    overflow-wrap:anywhere;
    word-break:normal;
  }

  .mainline{
    overflow:hidden;
  }

  .line-controls{
    max-width:100%;
    flex-wrap:wrap;
  }


  body{
    width:100%;
    margin:0;
    padding:0;
  }

  .wrap{
    width:100%;
    max-width:none;
    margin:0;
    padding:3px;
  }

  .top{
    width:100%;
    padding:5px;
    margin:0 0 5px 0;
    border-radius:0;
  }

  .list{
    width:100%;
    padding:2px;
    margin:0;
    border-radius:0;
  }

  .row{
    width:100%;
    padding:10px 0;
    margin:0;
  }

  .mainline{
    display:grid;
    grid-template-columns:auto auto 1fr;
    grid-template-rows:auto auto;
    width:100%;
    gap:5px;
    direction:ltr;
  }

  .text{
    width:100%;
    flex:0 0 100%;
    max-width:100%;
    margin:0;
    padding:0 3px;
    font-size:18px;
    line-height:1.2;
    text-align:right;
    direction:rtl;
  }

  .stop,
  .gpt{
    flex:0 0 auto;
    margin-top:3px;
  }

  .facts{
    width:100%;
    margin:6px 0 0 0;
  }

  .keyrow{
    grid-template-columns:1fr;
  }

  .subtitle{
    font-size:25px;
  }

  .mainline .text{
    grid-column:1 / -1;
    grid-row:1;
    width:100%;
    max-width:100%;
    direction:rtl;
    text-align:right;
  }

  .mainline .line-controls{
    grid-column:1;
    grid-row:2;
    justify-self:start;
  }

  .mainline .gpt{
    grid-column:2;
    grid-row:2;
    justify-self:start;
  }

}

  border-radius:16px;
  padding:14px;

}
.legacyTitle{

.noun-link{color:#1565c0;font-weight:800;text-decoration:none;cursor:pointer}
.noun-link:hover{text-decoration:underline}

.wrap,.top,.list,.row,.mainline,.text,.facts,.chatbar,.legacyPanel,.legacyFrame{

/* ===== KARAOKE PANEL ===== */
.karaoke-panel{
  margin-top:10px;
  min-height:145px;
  max-height:190px;
  overflow-y:auto;
  overflow-x:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px 22px;
  background:#777;
  border:4px solid #d4af37;
  border-radius:14px;
  box-shadow:0 0 0 2px #6f5710 inset,0 4px 14px #0005;
  direction:rtl;
  text-align:center;
}
#karaokeText{
  width:100%;
  font-size:34px;
  line-height:1.28;
  font-weight:900;
  color:#fff;
  text-shadow:0 2px 4px #000;
}
#karaokeText .kword{color:#fff;}
#karaokeText .kword.done,
#karaokeText .kword.active{
  color:#ffe45c;
  text-shadow:0 0 8px rgba(255,228,92,.7);
}

.karaoke-panel::-webkit-scrollbar{width:10px}
.karaoke-panel::-webkit-scrollbar-thumb{background:#444;border-radius:8px}
.karaoke-panel::-webkit-scrollbar-track{background:#999}

@media(max-width:400px){
  .karaoke-panel{min-height:120px;max-height:165px;padding:10px 8px;border-width:3px}
  #karaokeText{font-size:25px;line-height:1.22}
}


/* ===== INLINE KARAOKE: highlight directly on the active READ line ===== */
.karaoke-panel{display:none !important;}
.text .kword{color:inherit;}
.text .kword.done,
.text .kword.active{
  color:#d39b00;
  text-shadow:0 0 5px rgba(211,155,0,.25);
}



/* First two lines: no buttons */
.row.no-buttons .line-controls,
.row.no-buttons .gpt{display:none !important;}

/* First two lines: remove all buttons */
.list .row:nth-child(1) .line-controls,
.list .row:nth-child(1) .gpt,
.list .row:nth-child(2) .line-controls,
.list .row:nth-child(2) .gpt{

}

/* Karaoke highlight: RED */
.text .kword.done,
.text .kword.active{
  color:#ff0000 !important;
  text-shadow:0 0 5px rgba(255,0,0,.30) !important;
}

let initialAudioResetDone = false;

function resetAudioToBeginningOnce(){
  if(initialAudioResetDone) return;
  if(!Number.isFinite(audio.duration)) return;

  initialAudioResetDone = true;
  audio.pause();

  try{
    audio.currentTime = 0;
  }catch(_){}

  stopAt = null;
}

audio.addEventListener('loadedmetadata', resetAudioToBeginningOnce, {once:true});

// Extra mobile safeguard: after returning/reloading the page,

  if(!initialAudioResetDone && audio.readyState >= 1){
    resetAudioToBeginningOnce();
  }
});

const list=document.getElementById('list');

let karaokeIndex=-1;

function karaokeWords(text){
  return String(text||'').trim().split(/\s+/).filter(Boolean);
}

function showKaraoke(i,t){
  const c=captions[i];
  const row=list.querySelector(`.row[data-i="${i}"]`);
  if(!c || !row || !Number.isFinite(c.start) || !Number.isFinite(c.end) || c.end<=c.start){
    karaokeIndex=-1;
    return;
  }

  const textEl=row.querySelector('.text');
  if(!textEl)return;
  const words=karaokeWords(c.text);
  if(!words.length)return;

  if(karaokeIndex!==i || !textEl.querySelector('.kword')){
    // Restore any previous karaoke line to normal text.
    list.querySelectorAll('.text[data-karaoke="1"]').forEach(el=>{
      const oldIndex=Number(el.closest('.row')?.dataset.i);
      if(Number.isFinite(oldIndex) && captions[oldIndex]){
        el.textContent=captions[oldIndex].text || '';
      }
      el.removeAttribute('data-karaoke');
    });

    karaokeIndex=i;
    textEl.setAttribute('data-karaoke','1');
    textEl.innerHTML=words.map((w,n)=>
      `<span class="kword" data-k="${n}">${escapeHtml(w)}</span>`
    ).join(' ');


  }

  const start=captionStart(c), end=captionEnd(c);
  const p=Math.max(0,Math.min(0.999,(t-start)/Math.max(.01,end-start)));
  const active=Math.min(words.length-1,Math.floor(p*words.length));

  textEl.querySelectorAll('.kword').forEach((el,n)=>{
    el.classList.toggle('done',n<active);
    el.classList.toggle('active',n===active);
  });
}

function escapeHtml(v){
  return String(v).replace(/[&<>"']/g,ch=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));
}

function nounQuery(subject){
  const item = nounMap[subject];
  return (item && typeof item === "object") ? item.query : item;
}

function nounImage(subject){
  const item = nounMap[subject];
  return (item && typeof item === "object") ? (item.image || "") : "";
}

// ===== SUBJECT IMAGE AT BOTTOM =====
let subjectSlideTimer = null;
let subjectSlideItems = [];
let subjectSlideIndex = 0;

function subjectImageList(subject){
  const raw = nounImage(subject);
  if(Array.isArray(raw)) return raw.filter(Boolean);
  return raw ? [raw] : [];
}

function subjectsInTextInOrder(text){
  return Object.keys(nounMap)
    .map(subject => ({subject, pos: text.indexOf(subject)}))
    .filter(x => x.pos >= 0)
    .sort((a,b) => a.pos - b.pos || b.subject.length - a.subject.length)
    .map(x => x.subject);
}

function stopSubjectSlideshow(){
  if(subjectSlideTimer){ clearInterval(subjectSlideTimer); subjectSlideTimer = null; }
}

function renderSubjectSlide(){
  if(!subjectSlideItems.length || !subjectImage) return;
  const slide = subjectSlideItems[subjectSlideIndex % subjectSlideItems.length];
  subjectImage.src = slide.url;
  subjectImage.alt = slide.subject;
  if(subjectImageName) subjectImageName.textContent = slide.subject;
  subjectImage.style.display = 'block';
}

function startSubjectSlideshowForText(text){
  stopSubjectSlideshow();
  subjectSlideItems = [];
  subjectSlideIndex = 0;
  for(const subject of subjectsInTextInOrder(String(text || ''))){
    for(const url of subjectImageList(subject)) subjectSlideItems.push({subject, url});
  }
  if(!subjectSlideItems.length) return;
  renderSubjectSlide();
  subjectSlideTimer = setInterval(() => {
    subjectSlideIndex = (subjectSlideIndex + 1) % subjectSlideItems.length;
    renderSubjectSlide();
  }, 5000);
}

function showSubjectMedia(subject){
  const imageUrl = nounImage(subject);
  if(!subjectImage || !imageUrl) return;
  stopSubjectSlideshow();
  subjectImage.src = Array.isArray(imageUrl) ? imageUrl[0] : imageUrl;
  subjectImage.alt = subject;
  if(subjectImageName) subjectImageName.textContent = subject;
  subjectImage.style.display = 'block';
}

function escapeRegExp(text){
  return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}


const shownSubjects = new Set();

function makeNounLinks(text, container){
  container.innerHTML = "";

  const subjects = Object.keys(nounMap)
    .filter(word => text.includes(word))
    .sort((a,b) => b.length - a.length);

  if(!subjects.length){
    container.textContent = text;
    return;
  }

  const pattern = new RegExp(
    "(" + subjects.map(escapeRegExp).join("|") + ")",
    "g"
  );

  const parts = text.split(pattern);

  parts.forEach(part => {
    if(nounMap[part]){
      const key = part.trim().toLowerCase();

      if(shownSubjects.has(key)){
        // This subject already appeared earlier somewhere in the full text:
        // keep later occurrences as normal text.
        container.appendChild(document.createTextNode(part));
      } else {
        // First occurrence in the whole document:
        // make it blue and clickable.
        shownSubjects.add(key);

        const link = document.createElement("a");
        link.textContent = part;
        link.href = "#";
        link.className = "noun-link";
        link.addEventListener("click", e => {
          e.preventDefault();
          e.stopPropagation();
          showSubjectMedia(part);
        });
        container.appendChild(link);
      }
    } else {
      container.appendChild(document.createTextNode(part));
    }
  });
}

// ANDROID +9 SECOND TIMETAG FIX
// Android: start/end +9 seconds. Windows: original times.
// =========================================================
const ANDROID_TIMETAG_SHIFT = -1;

function isAndroid(){
  return /Android/i.test(navigator.userAgent);
}
function captionStart(c){
  return c.start + (isAndroid() ? ANDROID_TIMETAG_SHIFT : -19);
}
function captionEnd(c){
  return c.end + (isAndroid() ? ANDROID_TIMETAG_SHIFT : -19);
}


audio.addEventListener('timeupdate', () => {
  if (
    !playAllMode &&
    activeLineEnd !== null &&
    !audio.paused &&
    audio.currentTime >= activeLineEnd
  ) {
    const endPoint = activeLineEnd;
    activeLineEnd = null;
    audio.pause();
    try { audio.currentTime = endPoint; } catch (_) {}
  }
});




const playAllBtn = document.getElementById('playAllBtn');
if (playAllBtn) {
  playAllBtn.addEventListener('click', () => {
    playAllMode = true;
    activeLineEnd = null;
    audio.muted = false;

    // Start from the current player position; if already at the end, restart.
    if (Number.isFinite(audio.duration) && audio.currentTime >= audio.duration - 0.25) {
      audio.currentTime = 0;
    }
    audio.play();
  });
}
