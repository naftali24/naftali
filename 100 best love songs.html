*{box-sizing:border-box}
html,body{margin:0;background:#d3d3d3;font-family:Arial,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;color:#111}
.controls{
  width:min(400px,100%);padding:4px;display:flex;gap:2px;flex-wrap:nowrap;
  justify-content:center;position:sticky;top:0;z-index:20;background:#d3d3d3
}
button{
  border:0;border-radius:7px;padding:7px 5px;font-size:12px;font-weight:900;white-space:nowrap;flex:1 1 0;min-width:0;
  cursor:pointer;background:#222;color:#fff
}
button.secondary{background:#555}
button.record{background:#8b0000}
button:disabled{opacity:.5;cursor:not-allowed}
#stage{
  width:min(1280px,100vw);height:1050px;position:relative;overflow:hidden;
  box-shadow:0 8px 30px #0004;background:#f0f0f0
}
#chapterBg{position:absolute;inset:0}
#topHalf{
  position:absolute;left:0;right:0;top:0;height:500px;
  padding:18px 52px 10px;z-index:3;overflow:hidden
}
#title{
  margin:0 0 10px;text-align:center;font-size:clamp(32px,4.1vw,60px);
  line-height:1.02;font-weight:900;
  text-shadow:2px 2px 0 #fff,4px 4px 0 #999,6px 6px 8px #0004
}
#text{
  font-size:clamp(24px,2.35vw,37px);
  line-height:1.05;font-weight:900;text-align:left;
  text-shadow:1px 1px 0 #fff8;
  display:block;height:405px;
  overflow-y:auto;overflow-x:hidden;
  padding:0 12px 20px 4px;
  white-space:pre-line;
  -webkit-overflow-scrolling:touch
}
#imageBox{
  position:absolute;left:28px;right:28px;top:50%;height:50%;bottom:auto;z-index:2;
  border-radius:18px;overflow:hidden;border:4px solid #333;background:#ececec;
  box-shadow:0 0 18px #0003
}
#videoOpenBox{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  flex-direction:column;background:#111;color:#fff;cursor:pointer;gap:12px
}
.videoPlayIcon{font-size:clamp(70px,10vw,140px);line-height:1}
.videoOpenText{font-size:clamp(20px,3vw,38px);font-weight:900;letter-spacing:.5px}
#chapterNo,#caption{
  position:absolute;z-index:5;background:#ffffffe8;border:2px solid #333;
  border-radius:10px;padding:5px 10px;font-weight:900;color:#111
}
#chapterNo{left:42px;top:calc(50% + 12px);font-size:20px}
#caption{right:42px;top:calc(50% + 12px);font-size:11px;max-width:70%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#progress{width:min(1280px,100%);height:8px;background:#aaa}
#bar{height:100%;width:0;background:#222}
.status{padding:10px 12px;min-height:44px;font-weight:900;text-align:center;color:#111}
.note{max-width:1100px;padding:0 14px 18px;font-size:14px;color:#333;text-align:center}
canvas{display:none}

@media(max-width:700px){
  #stage{width:100vw;height:1100px;aspect-ratio:auto;overflow:hidden}
  #topHalf{padding:10px 16px 5px;height:500px;position:absolute;overflow:hidden}
  #imageBox{left:50%;right:auto;transform:translateX(-50%);top:600px;width:400px;height:400px;bottom:auto;border-width:2px;border-radius:0;max-width:100vw}
  #text{font-size:clamp(18px,5vw,28px);line-height:1.05;display:block;overflow-y:auto;overflow-x:hidden;height:350px;padding:0 8px 18px 2px;white-space:pre-line;-webkit-overflow-scrolling:touch}
  #title{font-size:clamp(22px,7vw,35px)}
  #chapterNo{left:16px;bottom:auto;font-size:15px}
  #caption{right:16px;bottom:auto;font-size:15px}
}

/* ===== FLOATING CHAPTER MENU ===== */
#menuBtn{
  position:fixed;
  right:12px;
  top:auto;
  bottom:330px;
  z-index:10002;
  width:auto;
  min-width:74px;
  flex:none;
  padding:10px 14px;
  border-radius:999px;
  background:#0b5cab;
  color:white;
  box-shadow:0 3px 12px #0005;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}
#chapterMenu{
  display:none;
  position:fixed;
  right:10px;
  top:108px;
  z-index:10001;
  width:min(360px,calc(100vw - 20px));
  max-height:72vh;
  overflow-y:auto;
  background:white;
  border:2px solid #333;
  border-radius:14px;
  padding:8px;
  box-shadow:0 8px 28px #0006;

#chapterMenu.open{display:block}
.chapter-menu-item{
  width:100%;
  display:block;
  text-align:left;
  direction:ltr;
  margin:0 0 5px;
  padding:9px 10px;
  border-radius:8px;

  font-size:15px;
  font-weight:800;
  white-space:normal;
}
.chapter-menu-item.active{

@media(max-width:700px){
  #menuBtn{

    bottom:70 !important;
    width:400px;
    max-width:100vw;
    height:400px !important;
  }
}

const SCHEMES = [
  {bg:'#f5e6e8', text:'#6d0015'},
  {bg:'#e3edf8', text:'#073b6f'},
  {bg:'#e5f2e8', text:'#14532d'},

  {bg:'#e2f1f2', text:'#00545a'},
  {bg:'#f9e4dc', text:'#7a2700'},
  {bg:'#e7ebf5', text:'#283c6b'},
  {bg:'#f3e5ef', text:'#6f174c'},

  {bg:'#e6f0f0', text:'#0b4f4a'}

let idx=0, playing=false, timer=null, startedAt=0;
let recording=false;

const titleEl=document.getElementById('title');
const textEl=document.getElementById('text');
const capEl=document.getElementById('caption');
const noEl=document.getElementById('chapterNo');
const bgEl=document.getElementById('chapterBg');
const bar=document.getElementById('bar');
const statusEl=document.getElementById('status');
const ttsBtn=document.getElementById('ttsBtn');
let ttsEnabled=true;

function stopTTS(){
  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
  }
}

function speakChapter(c){
  if(!ttsEnabled || !('speechSynthesis' in window) || !c) return;

  stopTTS();

  const speechText = `${c.title}. ${c.text}`;
  const u = new SpeechSynthesisUtterance(speechText);

  // Hebrew by default for this file.
  u.lang='en-US';
  u.rate=0.92;
  u.pitch=1;
  u.volume=1;

  // Prefer a Hebrew voice when one exists.
  const voices=window.speechSynthesis.getVoices();
  const voice=voices.find(v=>/^en(-|_)/i.test(v.lang));
  if(voice) u.voice=voice;

  u.onstart=()=>{
    statusEl.textContent='🔊 Reading chapter...';
  };
  u.onend=()=>{
    if(!playing) statusEl.textContent='Ready.';
  };
  u.onerror=()=>{
    if(!playing) statusEl.textContent='TTS is not available in this browser.';
  };

  window.speechSynthesis.speak(u);
}

ttsBtn.addEventListener('click',()=>{
  ttsEnabled=!ttsEnabled;
  ttsBtn.textContent=ttsEnabled ? '🔊 TTS ON' : '🔇 TTS OFF';
  if(!ttsEnabled) stopTTS();
  else speakChapter(chapters[idx]);
});

// Some browsers load voices asynchronously.
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged=()=>{};
}


function schemeFor(i){ return SCHEMES[i % SCHEMES.length]; }

const menuBtn=document.getElementById('menuBtn');
const chapterMenu=document.getElementById('chapterMenu');

// ===== DRAG THE FLOATING MENU BUTTON: mouse + Android touch =====
let menuDragging=false;
let menuMoved=false;
let dragDX=0;
let dragDY=0;

menuBtn.addEventListener('pointerdown',(e)=>{
  menuDragging=true;
  menuMoved=false;

  const r=menuBtn.getBoundingClientRect();
  dragDX=e.clientX-r.left;
  dragDY=e.clientY-r.top;

  // Switch to exact left/top coordinates when dragging starts.
  menuBtn.style.left=r.left+'px';
  menuBtn.style.top=r.top+'px';
  menuBtn.style.right='auto';
  menuBtn.style.bottom='auto';

  menuBtn.setPointerCapture(e.pointerId);
  e.preventDefault();
});

menuBtn.addEventListener('pointermove',(e)=>{
  if(!menuDragging)return;

  const maxX=Math.max(0,window.innerWidth-menuBtn.offsetWidth);
  const maxY=Math.max(0,window.innerHeight-menuBtn.offsetHeight);

  const x=Math.max(0,Math.min(maxX,e.clientX-dragDX));
  const y=Math.max(0,Math.min(maxY,e.clientY-dragDY));

  if(Math.abs(x-menuBtn.offsetLeft)>3 || Math.abs(y-menuBtn.offsetTop)>3){
    menuMoved=true;
  }

  menuBtn.style.left=x+'px';
  menuBtn.style.top=y+'px';
});

function finishMenuDrag(e){
  if(!menuDragging)return;
  menuDragging=false;
  try{menuBtn.releasePointerCapture(e.pointerId);}catch(_){}
}

menuBtn.addEventListener('pointerup',finishMenuDrag);
menuBtn.addEventListener('pointercancel',finishMenuDrag);

function buildChapterMenu(){
  chapterMenu.innerHTML='';
  chapters.forEach((c,i)=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='chapter-menu-item';
    b.textContent=c.title;
    b.dataset.index=i;
    b.addEventListener('click',()=>{
      stopPlay();
      showChapter(i);
      chapterMenu.classList.remove('open');
    });
    chapterMenu.appendChild(b);
  });
}

function updateChapterMenuActive(){
  chapterMenu.querySelectorAll('.chapter-menu-item').forEach((b,i)=>{
    b.classList.toggle('active',i===idx);
  });
}

menuBtn.addEventListener('click',(e)=>{
  if(menuMoved){
    menuMoved=false;
    e.preventDefault();
    return;
  }
  chapterMenu.classList.toggle('open');
});

document.addEventListener('click',(e)=>{
  if(!chapterMenu.contains(e.target) && e.target!==menuBtn){
    chapterMenu.classList.remove('open');
  }
});

buildChapterMenu();

function positionChapterLayout(){
  const topHalf=document.getElementById('topHalf');
  const imageBox=document.getElementById('imageBox');
  const stage=document.getElementById('stage');

  if(window.innerWidth > 700){
    const textBottom = topHalf.offsetTop + topHalf.scrollHeight;
    const gap = 30;
    const imageTop = Math.max(525, textBottom + gap);
    const imageHeight = 525;

    imageBox.style.top = imageTop + 'px';
    imageBox.style.bottom = 'auto';
    imageBox.style.height = imageHeight + 'px';
    stage.style.height = (imageTop + imageHeight) + 'px';

    noEl.style.top = (imageTop + 12) + 'px';
    capEl.style.top = (imageTop + 12) + 'px';
    imageSource.style.top = (imageTop + 14) + 'px';
    return;
  }

  positionAndroidImage();
}

function positionAndroidImage(){
  if(window.innerWidth > 700) return;
  const topHalf=document.getElementById('topHalf');
  const imageBox=document.getElementById('imageBox');
  const stage=document.getElementById('stage');

  // Keep enough room for all text, then place the 400x400 image box
  // at the absolute bottom of the stage.
  const textBottom = topHalf.offsetTop + topHalf.scrollHeight;
  const gap = 20;
  const imageHeight = 400;
  const stageHeight = Math.max(920, textBottom + gap + imageHeight + 100);

  stage.style.height = stageHeight + 'px';
  imageBox.style.top = 'auto';
  imageBox.style.bottom = '200px';
  imageBox.style.height = imageHeight + 'px';

  // Put chapter number and caption at the TOP of the image.
  const imageTop = stageHeight - 200 - imageHeight;
  noEl.style.top = (imageTop + 10) + 'px';
  capEl.style.top = (imageTop + 10) + 'px';
  imageSource.style.top = (imageTop + 12) + 'px';
}


function showChapter(i){
  idx=Math.max(0,Math.min(chapters.length-1,i));
  const c=chapters[idx], s=schemeFor(idx);
  bgEl.style.background=s.bg;
  titleEl.style.color=s.text;
  textEl.style.color=s.text;
  titleEl.textContent=c.title;
  textEl.textContent=c.text;
  textEl.scrollTop=0;
  capEl.textContent=c.caption||'';
  noEl.textContent=`${idx+1} / ${chapters.length}`;
  updateChapterMenuActive();
  bar.style.width='0%';
  requestAnimationFrame(positionChapterLayout);
  speakChapter(c);
}

function animateBar(){
  if(!playing) return;
  const p=Math.min(1,(performance.now()-startedAt)/DURATION);
  bar.style.width=(p*100)+'%';
  if(p<1) requestAnimationFrame(animateBar);
}

function stopPlay(){
  playing=false;
  stopTTS();
  if(timer) clearTimeout(timer);
  timer=null;
  statusEl.textContent='Stopped.';
}

function playAll(){
  stopPlay();
  playing=true;
  statusEl.textContent='מנגן — 7 שניות לכל Chapter';
  function step(){
    if(!playing) return;
    showChapter(idx);
    startedAt=performance.now();
    requestAnimationFrame(animateBar);
    timer=setTimeout(()=>{
      if(idx<chapters.length-1){idx++;step();}
      else{playing=false;bar.style.width='100%';statusEl.textContent='Finished.';}
    },DURATION);
  }
  step();
}

document.getElementById('playBtn').onclick=playAll;
document.getElementById('prevBtn').onclick=()=>{stopPlay();showChapter(idx-1);};
document.getElementById('nextBtn').onclick=()=>{stopPlay();showChapter(idx+1);};


function applyLanguage(lang,speak=true){
  stopTTS();
  currentLanguage=lang;
  chapters=lang==='he'?chaptersHe:chaptersEn;
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='he'?'rtl':'ltr';
  textEl.style.direction=lang==='he'?'rtl':'ltr';
  textEl.style.textAlign=lang==='he'?'right':'left';
  titleEl.style.direction=lang==='he'?'rtl':'ltr';
  capEl.style.direction=lang==='he'?'rtl':'ltr';
  document.getElementById('playBtn').textContent=lang==='he'?'▶ נגן הכל':'▶ Play All';
  document.getElementById('prevBtn').textContent=lang==='he'?'◀ הקודם':'◀ Previous';
  document.getElementById('nextBtn').textContent=lang==='he'?'הבא ▶':'Next ▶';
  menuBtn.textContent=lang==='he'?'☰ תפריט':'☰ Menu';
  buildChapterMenu();
  const was=ttsEnabled;
  if(!speak)ttsEnabled=false;
  showChapter(idx);
  ttsEnabled=was;
}
// Show first chapter silently on initial load; mobile browsers often require user interaction for speech.
ttsEnabled=false;
applyLanguage('he',false);
ttsEnabled=true;

document.addEventListener('pointerdown',()=>{
  if(!window.__ttsUserInteracted){
    window.__ttsUserInteracted=true;
  }
},{once:true});
window.addEventListener('resize', ()=>requestAnimationFrame(positionChapterLayout));
window.addEventListener('orientationchange', ()=>setTimeout(positionChapterLayout,150));


const videoOpenBox=document.getElementById('videoOpenBox');

function openCurrentVideo(){
  const c=chapters[idx];
  if(!c || !c.url)return;
  window.open(c.url,'_blank','noopener,noreferrer');
  statusEl.textContent='Opened YouTube in a new tab.';
}
videoOpenBox.addEventListener('click',openCurrentVideo);
videoOpenBox.addEventListener('keydown',e=>{
  if(e.key==='Enter' || e.key===' '){
    e.preventDefault();
    openCurrentVideo();
  }
});

</script>
