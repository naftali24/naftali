    "n": 1,
    "title": "1 – The Beatles - Let It Be",
    "text": "על השיר\nLet It Be מתאים במיוחד לשירה משותפת מפני שהרעיון הרגשי מגיע במהירות והמילים חוזרות לעוגנים שקל לזכור. השיר נפתח ב־“When I find myself in times of trouble” וחוזר שוב ושוב אל “Let it be, let it be”, כך שהמאזין מקבל נקודת אחיזה ברורה.\n\nמה המילים עושות\nבמקום עלילה מסובכת, השיר מפתח רגש מרכזי אחד. הבתים מוסיפים פרטים, והמשפטים החוזרים פועלים כמעט כמו שיחה שהקהל כבר יודע איך לענות לה.\n\nלמה להקשיב\nבהקלטה של The Beatles כדאי לשים לב ל־British pop/rock built on melody, harmony and studio invention. במיוחד מעניין לשמוע את ההבדל בין השורות הסיפוריות השקטות לבין המקומות שבהם העיבוד נפתח בפזמון.\n\nרגע השירה המשותפת\nנקודת הכניסה הטובה ביותר היא משפט הכותרת או הפזמון החוזר. מהרגע שהוא חוזר, קל לחזות את המבנה ולהצטרף — בדיוק מה שהופך הקלטה ישנה לשיר שחדר שלם יכול לשיר יחד.",

    "artistBio": "הביטלס לא היו רק להקת פופ מצליחה אלא אחת הלהקות ששינו באופן העמוק ביותר את הדרך שבה נכתבו, הוקלטו, שווקו ונשמעו שירי פופ ורוק. הלהקה צמחה בליברפול בסוף שנות החמישים מתוך The Quarrymen של ג'ון לנון. פול מקרטני הצטרף ב־1957, ג'ורג' האריסון ב־1958, ולאחר כמה גלגולים של ההרכב והשם התקבע השם The Beatles. תקופות ההופעות הארוכות בהמבורג בשנים 1960–1962 היו למעשה בית הספר שלהם: הם ניגנו שעות בכל לילה, למדו להחזיק קהל ופיתחו רפרטואר עצום של רוקנרול, R&B, קאנטרי ופופ אמריקאי.\n\nהמנהל בריאן אפשטיין ראה אותם ב־Cavern Club בליברפול ב־1961, שינה את הופעתם החיצונית, ארגן את הקריירה וניסה להשיג להם חוזה הקלטות. לאחר ש־Decca דחתה אותם, המפיק ג'ורג' מרטין החתים אותם ב־EMI/Parlophone. רינגו סטאר החליף את פיט בסט ב־1962, וכך נוצר ההרכב הקלאסי: לנון, מקרטני, האריסון וסטאר. Love Me Do היה הלהיט הראשון, Please Please Me האיץ את הפריצה, וב־1963 כבר השתלטה Beatlemania על בריטניה. הופעתם ב־Ed Sullivan Show בפברואר 1964 נצפתה בידי קהל אמריקאי עצום והייתה רגע מכריע ב'פלישה הבריטית' לארצות הברית.\n\nלנון ומקרטני חתמו יחד על רוב השירים, אך בפועל כתבו לעיתים קרובות בנפרד וסייעו זה לזה. לנון נטה לעיתים לכתיבה חדה, אישית, אירונית וניסיונית; מקרטני בלט במיוחד במלודיה, בהרמוניה ובעיבוד; האריסון התפתח מכותב משני ליוצר של Something, While My Guitar Gently Weeps ו־Here Comes the Sun; ורינגו, מעבר לתיפוף המאוד מזוהה שלו, שר שירים כמו With a Little Help from My Friends ואף כתב את Octopus's Garden.\n\nהשינוי הגדול ביותר התרחש באמצע שנות השישים. Rubber Soul ו־Revolver הראו שהלהקה כבר אינה מסתפקת בשירי אהבה קצרים. הם הכניסו סיטאר וכלים הודיים, רביעיות מיתרים, הקלטה לאחור, שינויי מהירות, tape loops ושיטות אולפן שלא היו מקובלות בפופ. Tomorrow Never Knows, Eleanor Rigby ו־Strawberry Fields Forever מדגימים עד כמה התרחקו מנוסחת להקת הגיטרות המוקדמת. ג'ורג' מרטין ומהנדסי EMI, במיוחד Geoff Emerick, היו שותפים חשובים בניסויים האלה.\n\nבאוגוסט 1966 הפסיקו הביטלס להופיע באופן סדיר. הצרחות בהופעות מנעו מהם לשמוע את עצמם, מערכות ההגברה היו חלשות, והם רצו ליצור באולפן מוזיקה שאי אפשר לשחזר על במה. Sgt.  Pepper's Lonely Hearts Club Band מ־1967 הפך את האלבום עצמו ליצירה מרכזית ולא רק לאוסף סינגלים. באותה שנה מת בריאן אפשטיין, והיעדרו החריף בהמשך בעיות ניהוליות.\n\nהתקופה האחרונה הייתה יצירתית אך מתוחה. The Beatles ('האלבום הלבן') הציג ארבעה יוצרים שהתרחקו זה מזה; פרויקט Get Back חשף את המתח בתוך הלהקה; ובכל זאת Abbey Road מ־1969 כלל כמה מהעבודות המלוטשות ביותר שלהם, ובהן המחרוזת בצד השני של האלבום. חילוקי דעות עסקיים, התפתחותם של ארבעה כיחידים, יחסיהם האישיים ושאלת הניהול לאחר מות אפשטיין הובילו לפירוק. מקרטני הודיע באפריל 1970 שאינו ממשיך לעבוד עם הלהקה.\n\nההשפעה של הביטלס חורגת ממספר התקליטים שמכרו. הם סייעו להפוך את הלהקה הכותבת את חומריה בעצמה למודל מרכזי ברוק, העלו את מעמדו של אלבום הפופ, הפכו את אולפן ההקלטות לכלי יצירתי בפני עצמו והשפיעו על אופנה, קולנוע, תרבות צעירים והיחס למוזיקה הודית. גם אחרי הפירוק המשיכו ארבעת החברים בקריירות נפרדות. לנון נרצח בניו יורק ב־1980, האריסון מת ב־2001, ומקרטני וסטאר המשיכו להקליט ולהופיע. עשרות שנים לאחר הפירוק, קטלוג הביטלס ממשיך להיות נקודת ייחוס מרכזית לכתיבת שירים, הפקה והרמוניות בפופ וברוק.",

    "artistBio": "הביטלס לא היו רק להקת פופ מצליחה אלא אחת הלהקות ששינו באופן העמוק ביותר את הדרך שבה נכתבו, הוקלטו, שווקו ונשמעו שירי פופ ורוק. הלהקה צמחה בליברפול בסוף שנות החמישים מתוך The Quarrymen של ג'ון לנון. פול מקרטני הצטרף ב־1957, ג'ורג' האריסון ב־1958, ולאחר כמה גלגולים של ההרכב והשם התקבע השם The Beatles. תקופות ההופעות הארוכות בהמבורג בשנים 1960–1962 היו למעשה בית הספר שלהם: הם ניגנו שעות בכל לילה, למדו להחזיק קהל ופיתחו רפרטואר עצום של רוקנרול, R&B, קאנטרי ופופ אמריקאי.\n\nהמנהל בריאן אפשטיין ראה אותם ב־Cavern Club בליברפול ב־1961, שינה את הופעתם החיצונית, ארגן את הקריירה וניסה להשיג להם חוזה הקלטות. לאחר ש־Decca דחתה אותם, המפיק ג'ורג' מרטין החתים אותם ב־EMI/Parlophone. רינגו סטאר החליף את פיט בסט ב־1962, וכך נוצר ההרכב הקלאסי: לנון, מקרטני, האריסון וסטאר. Love Me Do היה הלהיט הראשון, Please Please Me האיץ את הפריצה, וב־1963 כבר השתלטה Beatlemania על בריטניה. הופעתם ב־Ed Sullivan Show בפברואר 1964 נצפתה בידי קהל אמריקאי עצום והייתה רגע מכריע ב'פלישה הבריטית' לארצות הברית.\n\nלנון ומקרטני חתמו יחד על רוב השירים, אך בפועל כתבו לעיתים קרובות בנפרד וסייעו זה לזה. לנון נטה לעיתים לכתיבה חדה, אישית, אירונית וניסיונית; מקרטני בלט במיוחד במלודיה, בהרמוניה ובעיבוד; האריסון התפתח מכותב משני ליוצר של Something, While My Guitar Gently Weeps ו־Here Comes the Sun; ורינגו, מעבר לתיפוף המאוד מזוהה שלו, שר שירים כמו With a Little Help from My Friends ואף כתב את Octopus's Garden.\n\nהשינוי הגדול ביותר התרחש באמצע שנות השישים. Rubber Soul ו־Revolver הראו שהלהקה כבר אינה מסתפקת בשירי אהבה קצרים. הם הכניסו סיטאר וכלים הודיים, רביעיות מיתרים, הקלטה לאחור, שינויי מהירות, tape loops ושיטות אולפן שלא היו מקובלות בפופ. Tomorrow Never Knows, Eleanor Rigby ו־Strawberry Fields Forever מדגימים עד כמה התרחקו מנוסחת להקת הגיטרות המוקדמת. ג'ורג' מרטין ומהנדסי EMI, במיוחד Geoff Emerick, היו שותפים חשובים בניסויים האלה.\n\nבאוגוסט 1966 הפסיקו הביטלס להופיע באופן סדיר. הצרחות בהופעות מנעו מהם לשמוע את עצמם, מערכות ההגברה היו חלשות, והם רצו ליצור באולפן מוזיקה שאי אפשר לשחזר על במה. Sgt. Pepper's Lonely Hearts Club Band מ־1967 הפך את האלבום עצמו ליצירה מרכזית ולא רק לאוסף סינגלים. באותה שנה מת בריאן אפשטיין, והיעדרו החריף בהמשך בעיות ניהוליות.\n\nהתקופה האחרונה הייתה יצירתית אך מתוחה. The Beatles ('האלבום הלבן') הציג ארבעה יוצרים שהתרחקו זה מזה; פרויקט Get Back חשף את המתח בתוך הלהקה; ובכל זאת Abbey Road מ־1969 כלל כמה מהעבודות המלוטשות ביותר שלהם, ובהן המחרוזת בצד השני של האלבום. חילוקי דעות עסקיים, התפתחותם של ארבעה כיחידים, יחסיהם האישיים ושאלת הניהול לאחר מות אפשטיין הובילו לפירוק. מקרטני הודיע באפריל 1970 שאינו ממשיך לעבוד עם הלהקה.\n\nההשפעה של הביטלס חורגת ממספר התקליטים שמכרו. הם סייעו להפוך את הלהקה הכותבת את חומריה בעצמה למודל מרכזי ברוק, העלו את מעמדו של אלבום הפופ, הפכו את אולפן ההקלטות לכלי יצירתי בפני עצמו והשפיעו על אופנה, קולנוע, תרבות צעירים והיחס למוזיקה הודית. גם אחרי הפירוק המשיכו ארבעת החברים בקריירות נפרדות. לנון נרצח בניו יורק ב־1980, האריסון מת ב־2001, ומקרטני וסטאר המשיכו להקליט ולהופיע. עשרות שנים לאחר הפירוק, קטלוג הביטלס ממשיך להיות נקודת ייחוס מרכזית לכתיבת שירים, הפקה והרמוניות בפופ וברוק.",

async function speakLyricLine(text){
  if(!alloyEnabled) return;
  const clean=String(text||'').trim();
  if(!clean) return;

  try{
    restoreSpotifyAfterTts();

    // Android app: keep using the native Android TTS bridge.
    if(window.AndroidMaxTTS && AndroidMaxTTS.speak){
      if(AndroidMaxTTS.setRate) AndroidMaxTTS.setRate(getAlloySpeed());
      forceAndroidBritishEnglish();
      applyTtsVolume();
      AndroidMaxTTS.speak(clean);
      return;
    }

    // Windows/Desktop: use Chrome/Edge built-in Web Speech TTS.
    if('speechSynthesis' in window && 'SpeechSynthesisUtterance' in window){
      window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(clean);
      u.lang='en-US';
      u.rate=getAlloySpeed();
      u.pitch=1.0;
      u.volume=TTS_VOLUME;
      const voice=chooseWindowsTtsVoice();
      if(voice){ u.voice=voice; u.lang=voice.lang || u.lang; }
      u.onend=restoreSpotifyAfterTts;
      u.onerror=restoreSpotifyAfterTts;
      window.speechSynthesis.speak(u);
      return;
    }

    restoreSpotifyAfterTts();
    statusEl.textContent='TTS is not available in this browser.';
  }catch(err){
    restoreSpotifyAfterTts();
    console.error('TTS error:', err);
    statusEl.textContent='TTS error';
  }
}

// ===== DRAG THE FLOATING MENU BUTTON: mouse + Android touch =====
let menuDragging=false;
let menuMoved=false;
let dragDX=0;
let dragDY=0;

menuBtn.addEventListener('pointerdown',(e)=>{
  menuDragging=true;
  menuMoved=false;

  const r=menuBtn.getBoundingClientRect();
  dragDX=e.clientX-r.left;
  dragDY=e.clientY-r.top;

  // Switch to exact left/top coordinates when dragging starts.
  menuBtn.style.left=r.left+'px';
  menuBtn.style.top=r.top+'px';
  menuBtn.style.right='auto';
  menuBtn.style.bottom='auto';

  menuBtn.setPointerCapture(e.pointerId);
  e.preventDefault();
});

menuBtn.addEventListener('pointermove',(e)=>{
  if(!menuDragging)return;

  const maxX=Math.max(0,window.innerWidth-menuBtn.offsetWidth);
  const maxY=Math.max(0,window.innerHeight-menuBtn.offsetHeight);

  const x=Math.max(0,Math.min(maxX,e.clientX-dragDX));
  const y=Math.max(0,Math.min(maxY,e.clientY-dragDY));

  if(Math.abs(x-menuBtn.offsetLeft)>3 || Math.abs(y-menuBtn.offsetTop)>3){
    menuMoved=true;
  }

  menuBtn.style.left=x+'px';
  menuBtn.style.top=y+'px';
});

function finishMenuDrag(e){
  if(!menuDragging)return;
  menuDragging=false;
  try{menuBtn.releasePointerCapture(e.pointerId);}catch(_){}
}

menuBtn.addEventListener('pointerup',finishMenuDrag);
menuBtn.addEventListener('pointercancel',finishMenuDrag);

let githubSongAudio = null;

function hasGithubAudio(c){
  return !!(c && typeof c.audioUrl === 'string' && /^https?:\/\//i.test(c.audioUrl));
}

function stopGithubSong(){
  if(githubSongAudio){
    try{ githubSongAudio.pause(); }catch(e){}
    githubSongAudio = null;
  }
}

function playGithubSong(c){
  if(!hasGithubAudio(c)) return false;
  stopGithubSong();
  if(lyricsSyncTimer){ clearInterval(lyricsSyncTimer); lyricsSyncTimer = null; }

  const a = new Audio();
  githubSongAudio = a;
  a.preload = 'auto';
  a.src = c.audioUrl;

  a.addEventListener('timeupdate', function(){
    syncLyricsAt(a.currentTime);
    if(a.duration && isFinite(a.duration)){
      bar.style.width = Math.min(100, a.currentTime / a.duration * 100) + '%';
    }
  });

  a.addEventListener('ended', function(){
    bar.style.width = '100%';
    setSpotifyState('Finished');
  });

  a.addEventListener('error', function(){
    const code = a.error ? a.error.code : '?';
    alert('MP3 error. Code: ' + code + '\n\n' + c.audioUrl);
    setSpotifyState('MP3 error');
  });

  a.play().then(function(){
    setSpotifyState('Playing GitHub MP3');
  }).catch(function(err){
    alert('Could not play MP3:\n' + c.audioUrl + '\n\n' + err.message);
  });
  return true;
}

const LYRICS_SYNC_OFFSET=0;

function syncLyricsAt(seconds){
  if(!currentLyrics.length) return;
  let next=-1;
  for(let i=0;i<currentLyrics.length;i++){
    if(currentLyrics[i].time<=seconds) next=i;
    else break;
  }
  if(next===activeLyricIndex) return;
  if(activeLyricIndex>=0){
    const oldLine=textEl.querySelector(`[data-lyric-index="${activeLyricIndex}"]`);
    if(oldLine) oldLine.classList.remove('active');
  }
  activeLyricIndex=next;
  if(next>=0){
    const line=textEl.querySelector(`[data-lyric-index="${next}"]`);
    if(line){
      line.classList.add('active');
      line.scrollIntoView({block:'center',behavior:'smooth'});
      speakLyricLine(currentLyrics[next].text);
    }
  }
}

function runLyricsClockFrom(songTime){
  if(lyricsSyncTimer) clearInterval(lyricsSyncTimer);
  // Make the lyric clock equal the selected LRC timestamp at this instant.
  // No extra offset is applied; the selected line is the synchronization point.
  lyricsSyncStartMs=performance.now() - (songTime * 1000);
  syncLyricsAt(songTime); // keep the exact line that was tapped active immediately
  lyricsSyncTimer=setInterval(()=>{
    const elapsed=(performance.now()-lyricsSyncStartMs)/1000 + LYRICS_SYNC_OFFSET;
    syncLyricsAt(elapsed);
  },100);
}

function syncFromLyricLine(i){
  if(!currentLyrics[i]) return;
  activeLyricIndex=-1;
  textEl.querySelectorAll('.lyric-line.active').forEach(el=>el.classList.remove('active'));
  const tapped=textEl.querySelector(`[data-lyric-index="${i}"]`);
  if(tapped) tapped.classList.add('active');
  activeLyricIndex=i;
  speakLyricLine(currentLyrics[i].text);
  runLyricsClockFrom(currentLyrics[i].time);
  if(spotifyState) spotifyState.textContent='Synced from selected line';
}

}



let currentLyrics=[];
let activeLyricIndex=-1;
let currentLyricsChapter=null;

function parseLRC(raw){
  if(!raw) return [];
  const out=[];
  for(const line of raw.split(/\r?\n/)){
    const m=line.match(/^\[(\d{1,3}):(\d{2})(?:[.:](\d{1,3}))?\]\s?(.*)$/);
    if(!m) continue;
    const min=Number(m[1]);
    const sec=Number(m[2]);
    const frac=m[3] ? Number('0.'+m[3].padEnd(3,'0')) : 0;
    const text=(m[4]||'').trim();
    if(!text) continue;
    out.push({time:min*60+sec+frac,text});
  }
  return out.sort((a,b)=>a.time-b.time);
}

function showSynchronizedLyrics(c){
  currentLyricsChapter=c;
  textEl.classList.add('lyrics-mode');
  currentLyrics=parseLRC(c.lyrics||'');
  activeLyricIndex=-1;
  textEl.innerHTML='';
  if(!currentLyrics.length){
    textEl.textContent=currentLanguage==='he'
      ? 'עדיין לא הוכנסו מילים לשיר זה.'
      : 'Lyrics have not been added yet.';
    return;
  }
  currentLyrics.forEach((item,i)=>{
    const line=document.createElement('button');
    line.type='button';
    line.className='lyric-line lyric-sync-button';
    line.dataset.lyricIndex=i;
    line.textContent=item.text;
    line.title='Tap when you hear this line';
    line.addEventListener('click',()=>syncFromLyricLine(i));
    textEl.appendChild(line);
  });
}


/* ===== ANDROID FLOATING SPOTIFY: TWO SYNC MODES =====
   MODE 1 — AUTOMATIC / LYRICS BUTTON LIT:
   Artwork click starts Timer 1 at 00:00.
   The LYRICS button only turns automatic following ON/OFF.
   Turning it ON later does NOT reset Timer 1; it immediately jumps to the
   line that belongs to the elapsed artwork timer.

   MODE 2 — MANUAL LINE SYNC:
   Tap any lyric line yourself.
   The LYRICS button is switched OFF.
   Timer 2 starts from that clicked line's LRC timestamp.
   From there the following lines advance according to the time tags in code.
*/

let automaticLyricsMode = false;

// MODE 1 / Timer 1: reference clock started by artwork click; LYRICS button follows this timer.
let artworkTimerRunning = false;
let artworkTimerStartMs = 0;

// Timer 2: manual synchronization from a clicked lyric line.
let manualLineMode = false;
let manualLineBaseSeconds = 0;
let manualLineTimerStartMs = 0;

// One display loop handles whichever synchronization mode is active.
let androidLyricsLoop = null;

function ensureAndroidLyricsLoop(){
  if(androidLyricsLoop) return;

  androidLyricsLoop=setInterval(()=>{
    const c=chapters[idx];
    if(!c) return;

    let songTime = null;

    if(manualLineMode){
      songTime =
        manualLineBaseSeconds +
        ((performance.now()-manualLineTimerStartMs)/1000) +
        LYRICS_SYNC_OFFSET;
    }else if(automaticLyricsMode && artworkTimerRunning){
      // Automatic mode: 2.0 seconds before the LRC time tag.
      songTime =
        ((performance.now()-artworkTimerStartMs)/1000) +
        LYRICS_SYNC_OFFSET +
        2.0;
    }

    if(songTime===null) return;

    // Keep the synchronization clock running in the background,
    // but never force the user away from Song or Artist text.
    if(textMode==='lyrics'){
      if(currentLyricsChapter!==c){
        showSynchronizedLyrics(c);
      }
      syncLyricsAt(songTime);
    }

    // Song-end detection runs even when lyrics are not currently visible.
    checkAutoNextSong(songTime);
  },100);
}

function notifyAndroidLyricsButton(lit){
  try{
    if(window.AndroidLyrics && AndroidLyrics.setLyricsButtonLit){
      AndroidLyrics.setLyricsButtonLit;
    }
  }catch(e){}
}

function startArtworkTimer(){
  // Spotify is treated as starting at 00:00 at the instant artwork is tapped.
  artworkTimerStartMs=performance.now();
  artworkTimerRunning=true;
  autoNextSongArmed=true;

  // Artwork starts/restarts Timer 1, but does NOT force the Lyrics button ON.
  ensureAndroidLyricsLoop();
}

function setAutomaticLyricsMode(enabled){
  automaticLyricsMode=!!enabled;
  keepLyricsAcrossSongs=automaticLyricsMode;

  if(automaticLyricsMode){
    // Returning to automatic mode cancels manual line synchronization.
    manualLineMode=false;

    const c=chapters[idx];
    if(c){
      textMode='lyrics';
      showSynchronizedLyrics(c);
      artistBtn.textContent=currentLanguage==='he' ? 'שיר' : 'Song';

      // IMPORTANT: do not restart Timer 1.
      // If artwork has already started it, jump to wherever that timer is now.
      if(artworkTimerRunning){
        const elapsed =
          ((performance.now()-artworkTimerStartMs)/1000) +
          LYRICS_SYNC_OFFSET +
          1.5;
        syncLyricsAt(elapsed);
      }else{
        syncLyricsAt(0);
      }
    }
  }

  notifyAndroidLyricsButton(automaticLyricsMode);
  ensureAndroidLyricsLoop();
}

function startManualLineSync(i){
  if(!currentLyrics[i]) return;

  // MODE 2: user chooses the synchronization point by tapping a lyric line.
  // Turn the automatic LYRICS-button mode OFF.
  automaticLyricsMode=false;
  keepLyricsAcrossSongs=false;
  notifyAndroidLyricsButton(false);

  // Timer 2 starts from the exact LRC timestamp stored for the clicked line.
  manualLineMode=true;
  autoNextSongArmed=true;
  manualLineBaseSeconds=currentLyrics[i].time;
  manualLineTimerStartMs=performance.now();

  activeLyricIndex=-1;
  textEl.querySelectorAll('.lyric-line.active')
    .forEach(el=>el.classList.remove('active'));

  syncLyricsAt(manualLineBaseSeconds);
  ensureAndroidLyricsLoop();
}

// Replace the page's previous click-to-sync behavior.
// Clicking a lyric line now ALWAYS invokes Mode 2.
syncFromLyricLine = function(i){
  startManualLineSync(i);
};

window.startArtworkTimer=startArtworkTimer;
window.setAutomaticLyricsMode=setAutomaticLyricsMode;
window.startManualLineSync=startManualLineSync;


let keepLyricsAcrossSongs=false;



/* ===== RESTART / SHUFFLE RESET HELPERS ===== */
function stopAllBestEverTts(){
  try{
    if(typeof clearHtmlTtsQueue==='function') clearHtmlTtsQueue();
  }catch(e){}

  try{
    if(window.AndroidMaxTTS && AndroidMaxTTS.stop){
      AndroidMaxTTS.stop();
    }
  }catch(e){}

  try{
    if('speechSynthesis' in window){
      window.speechSynthesis.cancel();
    }
  }catch(e){}
}

function resetAllSyncCountersToZero(){
  // Automatic synchronization timer -> 00:00.
  artworkTimerStartMs=performance.now();
  artworkTimerRunning=true;

  // Manual synchronization timer -> cleared / 00:00.
  manualLineMode=false;
  manualLineBaseSeconds=0;
  manualLineTimerStartMs=performance.now();

  // Legacy lyric clock -> 00:00.
  lyricsSyncStartMs=performance.now();
  if(lyricsSyncTimer){
    clearInterval(lyricsSyncTimer);
    lyricsSyncTimer=null;
  }

  activeLyricIndex=-1;
  textEl.querySelectorAll('.lyric-line.active')
    .forEach(el=>el.classList.remove('active'));

  if(bar) bar.style.width='0%';

  // Keep the user's LYRICS ON/OFF choice.
  if(automaticLyricsMode && textMode==='lyrics'){
    syncLyricsAt(0);
  }

  autoNextSongArmed=true;
}

function restartCurrentSong(){
  stopAllBestEverTts();
  resetAllSyncCountersToZero();

  // Re-open the same exact Spotify track.
  launchCurrentSongInSpotify();

  // Keep lyrics state exactly as the user left it.
  if(automaticLyricsMode){
    notifyAndroidLyricsButton(true);
    if(textMode==='lyrics'){
      showSynchronizedLyrics(chapters[idx]);
      syncLyricsAt(0);
    }
  }
}

/* ===== SUFFLE MODE: RANDOM SONGS WITHOUT REPETITION ===== */
let suffleMode=false;
let suffleBag=[];
const shuffleArtworkBtn=document.getElementById('shuffleArtworkBtn');

function updateShuffleArtworkButton(){
  if(!shuffleArtworkBtn) return;
  shuffleArtworkBtn.classList.toggle('on', !!suffleMode);
}

function refillSuffleBag(){
  suffleBag=[];
  for(let i=0;i<chapters.length;i++){
    if(i!==idx) suffleBag.push(i);
  }

  // Fisher-Yates
  for(let i=suffleBag.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [suffleBag[i],suffleBag[j]]=[suffleBag[j],suffleBag[i]];
  }
}

function getNextSongIndex(){
  if(!suffleMode){
    return (idx+1)%chapters.length;
  }

  if(!suffleBag.length){
    refillSuffleBag();
  }

  if(!suffleBag.length){
    return (idx+1)%chapters.length;
  }

  return suffleBag.shift();
}


function removeCurrentFromSuffleBag(){
  if(!suffleMode) return;
  suffleBag=suffleBag.filter(i=>i!==idx);
}

function setSuffleMode(enabled){
  const wasOn=suffleMode;
  suffleMode=!!enabled;
  updateShuffleArtworkButton();

  if(suffleMode){
    // Every time shuffle is activated: silence TTS and reset every sync clock.
    stopAllBestEverTts();
    resetAllSyncCountersToZero();
    refillSuffleBag();

    // OFF -> ON: immediately choose and play a shuffled song.
    // Shuffle stays ON, so later song-end jumps remain shuffled too.
    if(!wasOn){
      setTimeout(()=>{
        goToNextSongAndPlaySpotify();
      },150);
    }
  }else{
    suffleBag=[];
  }
}

if(shuffleArtworkBtn){
  shuffleArtworkBtn.addEventListener('click',(e)=>{
    e.preventDefault();
    e.stopPropagation();
    if(!suffleMode) return;
    stopAllBestEverTts();
    resetAllSyncCountersToZero();
    goToNextSongAndPlaySpotify();
  });
}
updateShuffleArtworkButton();

/* ===== AUTO NEXT SONG WHEN LAST LRC TIMETAG IS REACHED ===== */
let autoNextSongArmed = false;
let autoNextSongLastChapter = -1;

function getCurrentSongEndTime(){
  const c=chapters[idx];
  if(!c) return null;
  const parsed=parseLRC(c.lyrics||'');
  if(!parsed.length) return null;

  // Use the final LRC timestamp as the known end marker.
  // Add a small grace period so the last line can be seen/heard.
  return parsed[parsed.length-1].time + 15.0;
}

function launchCurrentSongInSpotify(){
  const c=chapters[idx];
  if(!c) return;

  // loadCurrentSpotify() has already updated this exact ID for the new page.
  const id=(spotifyAppBtn && spotifyAppBtn.dataset)
    ? (spotifyAppBtn.dataset.spotifyId || '')
    : '';

  if(id){
    try{
      if(window.AndroidSpotify && AndroidSpotify.openTrack){
        AndroidSpotify.openTrack(id);
        return;
      }
    }catch(e){}

    // Desktop/Windows: open Spotify Web in the browser.
    // Android without the native bridge can still use the Spotify URI.
    const isAndroid=/Android/i.test(navigator.userAgent||'');
    if(!isAndroid){
      window.open('https://open.spotify.com/track/'+encodeURIComponent(id),'_blank','noopener');
    }else{
      window.location.href='spotify:track:'+id;
    }
    return;
  }

  // If this song has no saved Spotify ID, use the exact song search.
  const q=spotifyQueryFromChapter(c);
  try{
    if(window.AndroidSpotify && AndroidSpotify.searchSong){
      AndroidSpotify.searchSong(q);
      return;
    }
  }catch(e){}

  const isAndroid=/Android/i.test(navigator.userAgent||'');
  if(!isAndroid){
    window.open('https://open.spotify.com/search/'+encodeURIComponent(q),'_blank','noopener');
  }else{
    window.location.href='spotify:search:'+encodeURIComponent(q);
  }
}

function goToNextSongAndPlaySpotify(){
  if(!chapters || !chapters.length) return;

  const keepLyrics = !!keepLyricsAcrossSongs;
  const nextIndex = getNextSongIndex();

  try{
    manualLineMode=false;
    artworkTimerRunning=false;
  }catch(e){}

  showChapter(nextIndex);
  removeCurrentFromSuffleBag();

  autoNextSongArmed=false;

  setTimeout(()=>{
    launchCurrentSongInSpotify();

    // New Spotify track starts from 00:00.
    artworkTimerStartMs=performance.now();
    artworkTimerRunning=true;
    autoNextSongArmed=true;
    ensureAndroidLyricsLoop();

    if(keepLyrics){
      automaticLyricsMode=true;
      keepLyricsAcrossSongs=true;
      notifyAndroidLyricsButton(true);

      textMode='lyrics';
      showSynchronizedLyrics(chapters[idx]);
      syncLyricsAt(0);
    }else{
      automaticLyricsMode=false;
      notifyAndroidLyricsButton(false);
    }
  },1200);
}

function checkAutoNextSong(songTime){
  const endTime=getCurrentSongEndTime();
  if(endTime===null) return;

  // Re-arm whenever we are safely before the final timestamp.
  if(songTime < endTime-1.5){
    autoNextSongArmed=true;
  }

  if(autoNextSongArmed && songTime >= endTime){
    autoNextSongArmed=false;
    goToNextSongAndPlaySpotify();
  }
}

      startArtworkTimer();

      window.location.href=appUrl;
      return false;
    };
  }

  // Exact Spotify artwork when an exact Spotify ID is known.
  // Otherwise show the song artwork from its existing video ID while
  // keeping the whole image clickable to Spotify search.
  if(art){

    // This is used by Blue Velvet and any future GitHub-hosted songs.

function showChapter(i){
  if(lyricsSyncTimer){ clearInterval(lyricsSyncTimer); lyricsSyncTimer=null; }
  idx=Math.max(0,Math.min(chapters.length-1,i));
  const c=chapters[idx], s=schemeFor(idx);
  bgEl.style.background=s.bg;
  titleEl.style.color=s.text;
  textEl.style.color=s.text;
  titleEl.textContent=c.title;
  textMode='song';
  textEl.classList.remove('lyrics-mode');
  currentLyrics=[];
  currentLyricsChapter=null;
  activeLyricIndex=-1;
  textEl.textContent=c.text;
  textEl.scrollTop=0;
  capEl.textContent=c.caption||'';
  noEl.textContent=`${idx+1} / ${chapters.length}`;
  updateChapterMenuActive();
  bar.style.width='0%';
  requestAnimationFrame(positionChapterLayout);
  loadCurrentSpotify(c);
  // No automatic TTS. Speech only happens from the TTS button.
}

document.getElementById('prevBtn').onclick=()=>{showChapter(idx-1);};

}

<script>
/* WINDOWS/DESKTOP: Spotify Web only. Android keeps native Spotify app behavior. */
(function(){
  const isAndroid = /Android/i.test(navigator.userAgent || '');
  if(isAndroid) return;

  function spotifyWebFromHref(href){
    if(!href) return null;
    const track = href.match(/^spotify:track:([A-Za-z0-9]+)$/i);
    if(track) return 'https://open.spotify.com/track/' + encodeURIComponent(track[1]);
    const search = href.match(/^spotify:search:(.*)$/i);
    if(search) return 'https://open.spotify.com/search/' + encodeURIComponent(decodeURIComponent(search[1] || ''));
    return null;
  }

  document.addEventListener('click', function(e){
    const a = e.target.closest && e.target.closest('a');
    if(!a) return;
    const web = spotifyWebFromHref(a.getAttribute('href') || '');
    if(web){
      e.preventDefault();
      e.stopImmediatePropagation();
      window.open(web, '_blank', 'noopener');
    }
  }, true);

  window.addEventListener('DOMContentLoaded', function(){
    const artwork = document.getElementById('spotifyArtworkLink');
    if(artwork){
      const web = spotifyWebFromHref(artwork.getAttribute('href') || '');
      if(web){
        artwork.href = web;
        artwork.target = '_blank';
        artwork.rel = 'noopener';
      }
    }
  });
})();
</script>


<script>
/* FINAL WINDOWS RULE: open exact Spotify Web track: https://open.spotify.com/track/ + id */
(function(){
  const isAndroid = /Android/i.test(navigator.userAgent || '');
  if(isAndroid) return;

  function currentSpotifyId(){
    const btn = document.getElementById('spotifyAppBtn');
    if(btn && btn.dataset && btn.dataset.spotifyId) return btn.dataset.spotifyId;

    const art = document.getElementById('spotifyArtworkLink');
    if(art){
      const href = art.getAttribute('href') || '';
      let m = href.match(/spotify:track:([A-Za-z0-9]+)/i);
      if(m) return m[1];
      m = href.match(/open\.spotify\.com\/track\/([A-Za-z0-9]+)/i);
      if(m) return m[1];
    }
    return '';
  }

  function currentTrackUrl(){
    const id = currentSpotifyId();
    return id ? 'https://open.spotify.com/track/' + encodeURIComponent(id)
              : 'https://open.spotify.com/';
  }

  document.addEventListener('click', function(e){
    const el = e.target.closest && e.target.closest(
      '#spotifyArtworkLink,#spotifyAppBtn,#spotifyWebBtn'
    );
    if(!el) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    window.open(currentTrackUrl(), '_blank', 'noopener');
  }, true);
})();
</script>








<script>

    try{ lyricsBtn.classList.toggle('on', !!automaticLyricsMode); }catch(e){}
    try{ voiceBtn.classList.toggle('on', !!alloyEnabled); }catch(e){}
    try{ shuffleBtn.classList.toggle('on', !!suffleMode); }catch(e){}
  }

  lyricsBtn.addEventListener('click', function(){
    try{ setAutomaticLyricsMode; }catch(e){}
    refreshDesktopBar();
  });

  voiceBtn.addEventListener('click', function(){
    const real=document.getElementById('alloyBtn');
    if(real) real.click();
    refreshDesktopBar();
  });

  shuffleBtn.addEventListener('click', function(){
    try{ setSuffleMode; }catch(e){}
    refreshDesktopBar();
  });

  setInterval(refreshDesktopBar,500);
  refreshDesktopBar();
})();
</script>
