    "text": "Released in 1968.\n\nRELEASED: 1968\n\nABOUT THE SONG\nHey Jude is one of the best-known recordings associated with The Beatles. It was released in 1968 and became part of the artist’s lasting public identity. The song’s subject and emotional point are expressed through the relationship between the lyric, melody and performance.\n\nINTERESTING & UNIQUE FACTS\nPaul McCartney began the song as “Hey Jules,” intended to comfort Julian Lennon during his parents’ separation. Its unusually long sing-along coda helped turn a personal gesture into a communal anthem.\n\nWHY IT LASTED\nIts continued familiarity across generations shows how a distinctive recording can outlive the musical fashion of the moment.",
    "image": "",
    "caption": "The Beatles - Hey Jude",
    "artistBio": "The Beatles formed in Liverpool in 1960. The classic lineup was John Lennon, Paul McCartney, George Harrison and Ringo Starr. Before global fame they built their live reputation in Liverpool and Hamburg clubs, playing long sets that sharpened their musicianship.\n\nTheir breakthrough came in Britain in 1962–63 and then internationally during Beatlemania. Lennon and McCartney became one of the most important songwriting partnerships in popular music, while Harrison increasingly developed as a songwriter and introduced Indian musical influences. Producer George Martin was a crucial collaborator in their studio experimentation.\n\nFrom Rubber Soul and Revolver to Sgt. Pepper’s Lonely Hearts Club Band and Abbey Road, the group pushed pop recording toward new forms, sounds and production techniques. They stopped regular touring in 1966 and broke up in 1970. Their influence on songwriting, studio production, fashion and youth culture remains enormous.\n\nINTERESTING & UNIQUE FACTS\n• They spent formative periods playing extremely long sets in Hamburg, Germany, before becoming famous.\n• Brian Epstein became their manager in 1961 and helped transform their image and business organization.\n• George Martin, often called the 'fifth Beatle', was central to their studio sound and orchestral ideas.\n• They were among the first major rock groups to stop touring at their commercial peak and concentrate on studio work.\n• Sgt. Pepper helped establish the LP as an artistic statement rather than merely a collection of singles.\n• The rooftop concert in January 1969 became their last public performance together.",

    "text": "Released in 1961.\n\nRELEASED: 1961\n\nABOUT THE SONG\nCan't Help Falling in Love is one of the best-known recordings associated with Elvis Presley. It was released in 1961 and became part of the artist’s lasting public identity. The song’s subject and emotional point are expressed through the relationship between the lyric, melody and performance.\n\nINTERESTING & UNIQUE FACTS\nBuilt on the melody of the 18th-century French love song “Plaisir d’amour,” it was recorded for the film Blue Hawaii. Its gentle declaration of inevitable love became one of Presley's enduring ballads.\n\nWHY IT LASTED\nIts continued familiarity across generations shows how a distinctive recording can outlive the musical fashion of the moment.",

    "artistBio": "Elvis Presley was born in Tupelo, Mississippi, in 1935 and moved with his family to Memphis as a teenager. His early musical world included gospel, country and rhythm and blues. In 1954 he began recording for Sun Records with producer Sam Phillips.\n\nHis blend of Black-influenced rhythm and blues with country helped shape the early sound of rock and roll. By 1956, songs such as Heartbreak Hotel and Hound Dog had made him a national star. His stage movement, voice and image challenged conservative ideas about youth entertainment.\n\nAfter military service in Germany, Elvis spent much of the 1960s making films. His 1968 television comeback special restored his reputation as a powerful live performer. He later became strongly associated with Las Vegas. Elvis died in 1977 at age 42 and remains one of the most recognizable figures in popular culture.\n\nINTERESTING & UNIQUE FACTS\n• His first commercially released single, That’s All Right, was recorded at Sun Studio in Memphis.\n• Colonel Tom Parker managed his career and exerted enormous control over touring, films and contracts.\n• Elvis served in the U.S. Army from 1958 to 1960 and was stationed in Germany.\n• He never performed a concert outside North America despite his global fame.\n• The 1968 Comeback Special marked a decisive return to a more raw and direct performance style.\n• Graceland became one of the most visited private homes in the United States after his death.",

    "text": "Released in 1982.\n\nRELEASED: 1983\n\nABOUT THE SONG\nBillie Jean is one of the best-known recordings associated with Michael Jackson. It was released in 1983 and became part of the artist’s lasting public identity. The song’s subject and emotional point are expressed through the relationship between the lyric, melody and performance.\n\nINTERESTING & UNIQUE FACTS\nThe story centers on a woman who claims the narrator fathered her child, a claim he denies. Jackson said the idea drew on stories about groupies surrounding his brothers. The instantly recognizable bass line and Jackson’s Motown 25 performance helped make the song a defining pop moment.\n\nWHY IT LASTED\nIts continued familiarity across generations shows how a distinctive recording can outlive the musical fashion of the moment.",

    "artistBio": "Michael Jackson was born in Gary, Indiana, in 1958. He entered show business as a child in the Jackson 5, where his unusually mature voice and stage presence quickly made him the group’s focal point.\n\nHis adult solo breakthrough came with Off the Wall in 1979, produced by Quincy Jones. Thriller followed in 1982 and became one of the most successful albums in recording history. Billie Jean, Beat It and Thriller demonstrated Jackson’s ability to combine pop, funk, R&B and rock.\n\nJackson also transformed the music video into a major cultural form. His dancing, especially the moonwalk, became globally imitated. Albums such as Bad and Dangerous kept him at the center of international pop. He died in 2009. His legacy is both artistically enormous and publicly complicated.\n\nINTERESTING & UNIQUE FACTS\n• He joined the Jackson 5 as a child and became the group’s lead singer while still very young.\n• Quincy Jones produced Off the Wall, Thriller and Bad, three of Jackson’s defining albums.\n• Thriller’s short film helped turn the music video into a major cinematic art form.\n• At Motown 25 in 1983, Jackson’s performance of Billie Jean introduced the moonwalk to a huge television audience.\n• He held unusually detailed control over choreography, arrangements and visual presentation.\n• His Neverland Ranch became one of the most famous celebrity residences of the late 20th century.",

    "text": "Released in 1975.\n\nRELEASED: 1975\n\nABOUT THE SONG\nBohemian Rhapsody is one of the best-known recordings associated with Queen. It was released in 1975 and became part of the artist’s lasting public identity. The song’s subject and emotional point are expressed through the relationship between the lyric, melody and performance.\n\nINTERESTING & UNIQUE FACTS\nFreddie Mercury never gave a definitive explanation of the lyrics, preferring listeners to interpret them. The recording combines ballad, mock opera and hard rock, with huge numbers of vocal overdubs; its promotional film also became a landmark in music-video history.\n\nWHY IT LASTED\nIts continued familiarity across generations shows how a distinctive recording can outlive the musical fashion of the moment.",

    "text": "Released in 1976.\n\nRELEASED: 1976\n\nABOUT THE SONG\nDancing Queen is one of the best-known recordings associated with ABBA. It was released in 1976 and became part of the artist’s lasting public identity. The song’s subject and emotional point are expressed through the relationship between the lyric, melody and performance.\n\nINTERESTING & UNIQUE FACTS\nThe song celebrates the exhilaration and freedom of dancing. Its layered piano figures, harmonies and polished production became a model of 1970s pop craftsmanship.\n\nWHY IT LASTED\nIts continued familiarity across generations shows how a distinctive recording can outlive the musical fashion of the moment.",

    "text": "Released in 1965.\n\nRELEASED: 1965\n\nABOUT THE SONG\n(I Can't Get No) Satisfaction is one of the best-known recordings associated with The Rolling Stones. It was released in 1965 and became part of the artist’s lasting public identity. The song’s subject and emotional point are expressed through the relationship between the lyric, melody and performance.\n\nINTERESTING & UNIQUE FACTS\nThe song became closely associated with The Rolling Stones because of its memorable melody, vocal or instrumental character, and the way it captures the musical style of its period. An interesting way to hear it is to notice how the arrangement builds its identity through rhythm, harmony, production and performance rather than through the words alone.\n\nWHY IT LASTED\nIts continued familiarity across generations shows how a distinctive recording can outlive the musical fashion of the moment.",
    "image": "",

    "title": "1 – The Beatles - Hey Jude",
    "text": "יצא בשנת 1968.\n\nעל מה השיר?\nפול מקרטני החל לכתוב את Hey Jude ביוני 1968 בזמן שנסע לבקר את סינתיה לנון ואת בנה ג'וליאן, לאחר שג'ון לנון עזב את המשפחה והחל את יחסיו עם יוקו אונו. השם הראשוני היה Hey Jules. מקרטני דמיין את עצמו מעודד את ג'וליאן הילד: אל תיתן למצב הקשה לשבור אותך; קח שיר עצוב והפוך אותו למשהו טוב יותר. אחר כך שינה את Jules ל־Jude מפני שהצליל התאים לו יותר.\n\nעם זאת, המילים אינן מספרות סיפור חד־משמעי רק על ג'וליאן. ג'ון לנון חשב שמקרטני אולי כתב, אפילו בלי להתכוון, גם עליו ועל יחסיו החדשים עם יוקו. אפשר לשמוע בשיר מסר רחב יותר לאדם שפוחד לפתוח את עצמו לאהבה: אל תישאר בחוץ, אל תפחד, הכנס אותה ללבך ואז תוכל להתחיל לשפר את חייך.\n\nמה מיוחד בהקלטה?\nהשיר מתחיל בצורה כמעט אינטימית: קולו של מקרטני ופסנתר. בהדרגה נכנסים שאר הכלים והקולות. ההקלטה הבסיסית נעשתה ב־Trident Studios בלונדון, אולפן שהיה מצויד במכונת שמונה ערוצים בזמן ש־Abbey Road עדיין עבד במידה רבה עם ארבעה ערוצים. ג'ורג' מרטין היה המפיק.\n\nהחלק שהפך את Hey Jude לחריג במיוחד הוא הסיום. אחרי גוף שיר רגיל יחסית מתחיל קטע ארוך של na-na-na שנמשך יותר מארבע דקות. הביטלס הוסיפו תזמורת גדולה וקבוצת מוזיקאים ששרה ומחאה כפיים יחד איתם. במקום לסיים אחרי שלוש דקות כמקובל בסינגל פופ של התקופה, השיר נמשך יותר משבע דקות. חברת התקליטים חששה בתחילה מאורכו, אבל הצלחתו הראתה ששיר ארוך מאוד יכול להפוך ללהיט ענק ברדיו.\n\nיש בהקלטה גם רגעים אנושיים קטנים. לקראת סוף אחד הבתים אפשר לשמוע ברקע קול קצר לפני שהשיר ממשיך — חלק מהאווירה הלא־מלוטשת לחלוטין שנשארה במיקס. מקרטני גם דוחף את קולו בהדרגה משירה רכה לצעקות ואלתורים מעל מקהלת ה־na-na-na.\n\nמקומו בקריירה של הביטלס\nHey Jude היה הסינגל הראשון שיצא בלייבל Apple Records של הביטלס, יחד עם Revolution בצד השני. הוא יצא בתקופה מורכבת מאוד: הלהקה עבדה על 'האלבום הלבן', היחסים בין החברים נעשו מתוחים יותר, ויוקו אונו הייתה נוכחת יותר ויותר בסביבת האולפן. דווקא בתוך התקופה הזאת נוצר אחד השירים החמים והקהילתיים ביותר שלהם.\n\nהשיר הגיע למקום הראשון בארצות הברית ונשאר שם תשעה שבועות. הוא הפך לאחד הסינגלים המצליחים ביותר של הביטלס ולאחד מרגעי השיא בהופעות הסולו המאוחרות של מקרטני, שבהן הוא נותן לקהל לשיר לבדו את קטע ה־na-na-na. כך שיר שנולד כניסיון פרטי לנחם ילד בזמן גירושי הוריו הפך לשיר המוני על נחמה, אומץ והיכולת להפוך כאב להתחלה חדשה.",

async function speakLyricLine(text){
  if(!alloyEnabled) return;
  const clean=String(text||'').trim();
  if(!clean) return;

  try{
    restoreSpotifyAfterTts();

    // Android app: keep using the native Android TTS bridge.
    if(window.AndroidMaxTTS && AndroidMaxTTS.speak){
      if(AndroidMaxTTS.setRate) AndroidMaxTTS.setRate(getAlloySpeed());
      forceAndroidBritishEnglish();
      applyTtsVolume();
      AndroidMaxTTS.speak(clean);
      return;
    }

    // Windows/Desktop: use Chrome/Edge built-in Web Speech TTS.
    if('speechSynthesis' in window && 'SpeechSynthesisUtterance' in window){
      window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(clean);
      u.lang='en-US';
      u.rate=getAlloySpeed();
      u.pitch=1.0;
      u.volume=TTS_VOLUME;
      const voice=chooseWindowsTtsVoice();
      if(voice){ u.voice=voice; u.lang=voice.lang || u.lang; }
      u.onend=restoreSpotifyAfterTts;
      u.onerror=restoreSpotifyAfterTts;
      window.speechSynthesis.speak(u);
      return;
    }

    restoreSpotifyAfterTts();
    statusEl.textContent='TTS is not available in this browser.';
  }catch(err){
    restoreSpotifyAfterTts();
    console.error('TTS error:', err);
    statusEl.textContent='TTS error';
  }
}

// ===== DRAG THE FLOATING MENU BUTTON: mouse + Android touch =====
let menuDragging=false;
let menuMoved=false;
let dragDX=0;
let dragDY=0;

menuBtn.addEventListener('pointerdown',(e)=>{
  menuDragging=true;
  menuMoved=false;

  const r=menuBtn.getBoundingClientRect();
  dragDX=e.clientX-r.left;
  dragDY=e.clientY-r.top;

  // Switch to exact left/top coordinates when dragging starts.
  menuBtn.style.left=r.left+'px';
  menuBtn.style.top=r.top+'px';
  menuBtn.style.right='auto';
  menuBtn.style.bottom='auto';

  menuBtn.setPointerCapture(e.pointerId);
  e.preventDefault();
});

menuBtn.addEventListener('pointermove',(e)=>{
  if(!menuDragging)return;

  const maxX=Math.max(0,window.innerWidth-menuBtn.offsetWidth);
  const maxY=Math.max(0,window.innerHeight-menuBtn.offsetHeight);

  const x=Math.max(0,Math.min(maxX,e.clientX-dragDX));
  const y=Math.max(0,Math.min(maxY,e.clientY-dragDY));

  if(Math.abs(x-menuBtn.offsetLeft)>3 || Math.abs(y-menuBtn.offsetTop)>3){
    menuMoved=true;
  }

  menuBtn.style.left=x+'px';
  menuBtn.style.top=y+'px';
});

function finishMenuDrag(e){
  if(!menuDragging)return;
  menuDragging=false;
  try{menuBtn.releasePointerCapture(e.pointerId);}catch(_){}
}

menuBtn.addEventListener('pointerup',finishMenuDrag);
menuBtn.addEventListener('pointercancel',finishMenuDrag);

let githubSongAudio = null;

function hasGithubAudio(c){
  return !!(c && typeof c.audioUrl === 'string' && /^https?:\/\//i.test(c.audioUrl));
}

function stopGithubSong(){
  if(githubSongAudio){
    try{ githubSongAudio.pause(); }catch(e){}
    githubSongAudio = null;
  }
}

function playGithubSong(c){
  if(!hasGithubAudio(c)) return false;
  stopGithubSong();
  if(lyricsSyncTimer){ clearInterval(lyricsSyncTimer); lyricsSyncTimer = null; }

  const a = new Audio();
  githubSongAudio = a;
  a.preload = 'auto';
  a.src = c.audioUrl;

  a.addEventListener('timeupdate', function(){
    syncLyricsAt(a.currentTime);
    if(a.duration && isFinite(a.duration)){
      bar.style.width = Math.min(100, a.currentTime / a.duration * 100) + '%';
    }
  });

  a.addEventListener('ended', function(){
    bar.style.width = '100%';
    setSpotifyState('Finished');
  });

  a.addEventListener('error', function(){
    const code = a.error ? a.error.code : '?';
    alert('MP3 error. Code: ' + code + '\n\n' + c.audioUrl);
    setSpotifyState('MP3 error');
  });

  a.play().then(function(){
    setSpotifyState('Playing GitHub MP3');
  }).catch(function(err){
    alert('Could not play MP3:\n' + c.audioUrl + '\n\n' + err.message);
  });
  return true;
}

let lyricsSyncStartMs=0;
let lyricsSyncTimer=null;
const LYRICS_SYNC_OFFSET=0;

function syncLyricsAt(seconds){
  if(!currentLyrics.length) return;
  let next=-1;
  for(let i=0;i<currentLyrics.length;i++){
    if(currentLyrics[i].time<=seconds) next=i;
    else break;
  }
  if(next===activeLyricIndex) return;
  if(activeLyricIndex>=0){
    const oldLine=textEl.querySelector(`[data-lyric-index="${activeLyricIndex}"]`);
    if(oldLine) oldLine.classList.remove('active');
  }
  activeLyricIndex=next;
  if(next>=0){
    const line=textEl.querySelector(`[data-lyric-index="${next}"]`);
    if(line){
      line.classList.add('active');
      line.scrollIntoView({block:'center',behavior:'smooth'});
      speakLyricLine(currentLyrics[next].text);
    }
  }
}

function runLyricsClockFrom(songTime){
  if(lyricsSyncTimer) clearInterval(lyricsSyncTimer);
  // Make the lyric clock equal the selected LRC timestamp at this instant.
  // No extra offset is applied; the selected line is the synchronization point.
  lyricsSyncStartMs=performance.now() - (songTime * 1000);
  syncLyricsAt(songTime); // keep the exact line that was tapped active immediately
  lyricsSyncTimer=setInterval(()=>{
    const elapsed=(performance.now()-lyricsSyncStartMs)/1000 + LYRICS_SYNC_OFFSET;
    syncLyricsAt(elapsed);
  },100);
}

function syncFromLyricLine(i){
  if(!currentLyrics[i]) return;
  activeLyricIndex=-1;
  textEl.querySelectorAll('.lyric-line.active').forEach(el=>el.classList.remove('active'));
  const tapped=textEl.querySelector(`[data-lyric-index="${i}"]`);
  if(tapped) tapped.classList.add('active');
  activeLyricIndex=i;
  speakLyricLine(currentLyrics[i].text);
  runLyricsClockFrom(currentLyrics[i].time);
  if(spotifyState) spotifyState.textContent='Synced from selected line';
}

let currentLyrics=[];
let activeLyricIndex=-1;
let currentLyricsChapter=null;

function parseLRC(raw){
  if(!raw) return [];
  const out=[];
  for(const line of raw.split(/\r?\n/)){
    const m=line.match(/^\[(\d{1,3}):(\d{2})(?:[.:](\d{1,3}))?\]\s?(.*)$/);
    if(!m) continue;
    const min=Number(m[1]);
    const sec=Number(m[2]);
    const frac=m[3] ? Number('0.'+m[3].padEnd(3,'0')) : 0;
    const text=(m[4]||'').trim();
    if(!text) continue;
    out.push({time:min*60+sec+frac,text});
  }
  return out.sort((a,b)=>a.time-b.time);
}

function showSynchronizedLyrics(c){
  currentLyricsChapter=c;
  textEl.classList.add('lyrics-mode');
  currentLyrics=parseLRC(c.lyrics||'');
  activeLyricIndex=-1;
  textEl.innerHTML='';
  if(!currentLyrics.length){
    textEl.textContent=currentLanguage==='he'
      ? 'עדיין לא הוכנסו מילים לשיר זה.'
      : 'Lyrics have not been added yet.';
    return;
  }
  currentLyrics.forEach((item,i)=>{
    const line=document.createElement('button');
    line.type='button';
    line.className='lyric-line lyric-sync-button';
    line.dataset.lyricIndex=i;
    line.textContent=item.text;
    line.title='Tap when you hear this line';
    line.addEventListener('click',()=>syncFromLyricLine(i));
    textEl.appendChild(line);
  });
}


/* ===== ANDROID FLOATING SPOTIFY: TWO SYNC MODES =====
   MODE 1 — AUTOMATIC / LYRICS BUTTON LIT:
   Artwork click starts Timer 1 at 00:00.
   The LYRICS button only turns automatic following ON/OFF.
   Turning it ON later does NOT reset Timer 1; it immediately jumps to the
   line that belongs to the elapsed artwork timer.

   MODE 2 — MANUAL LINE SYNC:
   Tap any lyric line yourself.
   The LYRICS button is switched OFF.
   Timer 2 starts from that clicked line's LRC timestamp.
   From there the following lines advance according to the time tags in code.
*/

let automaticLyricsMode = false;

// MODE 1 / Timer 1: reference clock started by artwork click; LYRICS button follows this timer.
let artworkTimerRunning = false;
let artworkTimerStartMs = 0;

// Timer 2: manual synchronization from a clicked lyric line.
let manualLineMode = false;
let manualLineBaseSeconds = 0;
let manualLineTimerStartMs = 0;

// One display loop handles whichever synchronization mode is active.
let androidLyricsLoop = null;

function ensureAndroidLyricsLoop(){
  if(androidLyricsLoop) return;

  androidLyricsLoop=setInterval(()=>{
    const c=chapters[idx];
    if(!c) return;

    let songTime = null;

    if(manualLineMode){
      songTime =
        manualLineBaseSeconds +
        ((performance.now()-manualLineTimerStartMs)/1000) +
        LYRICS_SYNC_OFFSET;
    }else if(automaticLyricsMode && artworkTimerRunning){
      // Automatic mode: 2.0 seconds before the LRC time tag.
      songTime =
        ((performance.now()-artworkTimerStartMs)/1000) +
        LYRICS_SYNC_OFFSET +
        2.0;
    }

    if(songTime===null) return;

    // Keep the synchronization clock running in the background,
    // but never force the user away from Song or Artist text.
    if(textMode==='lyrics'){
      if(currentLyricsChapter!==c){
        showSynchronizedLyrics(c);
      }
      syncLyricsAt(songTime);
    }

    // Song-end detection runs even when lyrics are not currently visible.
    checkAutoNextSong(songTime);
  },100);
}

function notifyAndroidLyricsButton(lit){
  try{
    if(window.AndroidLyrics && AndroidLyrics.setLyricsButtonLit){
      AndroidLyrics.setLyricsButtonLit(!!lit);
    }
  }catch(e){}
}

function startArtworkTimer(){
  // Spotify is treated as starting at 00:00 at the instant artwork is tapped.
  artworkTimerStartMs=performance.now();
  artworkTimerRunning=true;
  autoNextSongArmed=true;

  // Artwork starts/restarts Timer 1, but does NOT force the Lyrics button ON.
  ensureAndroidLyricsLoop();
}

function setAutomaticLyricsMode(enabled){
  automaticLyricsMode=!!enabled;
  keepLyricsAcrossSongs=automaticLyricsMode;

  if(automaticLyricsMode){
    // Returning to automatic mode cancels manual line synchronization.
    manualLineMode=false;

    const c=chapters[idx];
    if(c){
      textMode='lyrics';
      showSynchronizedLyrics(c);
      artistBtn.textContent=currentLanguage==='he' ? 'שיר' : 'Song';

      // IMPORTANT: do not restart Timer 1.
      // If artwork has already started it, jump to wherever that timer is now.
      if(artworkTimerRunning){
        const elapsed =
          ((performance.now()-artworkTimerStartMs)/1000) +
          LYRICS_SYNC_OFFSET +
          1.5;
        syncLyricsAt(elapsed);
      }else{
        syncLyricsAt(0);
      }
    }
  }

  notifyAndroidLyricsButton(automaticLyricsMode);
  ensureAndroidLyricsLoop();
}

function startManualLineSync(i){
  if(!currentLyrics[i]) return;

  // MODE 2: user chooses the synchronization point by tapping a lyric line.
  // Turn the automatic LYRICS-button mode OFF.
  automaticLyricsMode=false;
  keepLyricsAcrossSongs=false;
  notifyAndroidLyricsButton(false);

  // Timer 2 starts from the exact LRC timestamp stored for the clicked line.
  manualLineMode=true;
  autoNextSongArmed=true;
  manualLineBaseSeconds=currentLyrics[i].time;
  manualLineTimerStartMs=performance.now();

  activeLyricIndex=-1;
  textEl.querySelectorAll('.lyric-line.active')
    .forEach(el=>el.classList.remove('active'));

  syncLyricsAt(manualLineBaseSeconds);
  ensureAndroidLyricsLoop();
}

// Replace the page's previous click-to-sync behavior.
// Clicking a lyric line now ALWAYS invokes Mode 2.
syncFromLyricLine = function(i){
  startManualLineSync(i);
};

function resetAllSyncCountersToZero(){

/* ===== SUFFLE MODE: RANDOM SONGS WITHOUT REPETITION ===== */
let suffleMode=false;
let suffleBag=[];
const shuffleArtworkBtn=document.getElementById('shuffleArtworkBtn');

function updateShuffleArtworkButton(){
  if(!shuffleArtworkBtn) return;
  shuffleArtworkBtn.classList.toggle('on', !!suffleMode);
}

function refillSuffleBag(){
  suffleBag=[];
  for(let i=0;i<chapters.length;i++){
    if(i!==idx) suffleBag.push(i);
  }

  // Fisher-Yates
  for(let i=suffleBag.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [suffleBag[i],suffleBag[j]]=[suffleBag[j],suffleBag[i]];
  }
}

function getNextSongIndex(){
  if(!suffleMode){
    return (idx+1)%chapters.length;
  }

  if(!suffleBag.length){
    refillSuffleBag();
  }

  if(!suffleBag.length){
    return (idx+1)%chapters.length;
  }

  return suffleBag.shift();
}


function removeCurrentFromSuffleBag(){
  if(!suffleMode) return;
  suffleBag=suffleBag.filter(i=>i!==idx);
}

function setSuffleMode(enabled){
  const wasOn=suffleMode;
  suffleMode=!!enabled;
  updateShuffleArtworkButton();

  if(suffleMode){
    // Every time shuffle is activated: silence TTS and reset every sync clock.
    stopAllBestEverTts();
    resetAllSyncCountersToZero();
    refillSuffleBag();

    // OFF -> ON: immediately choose and play a shuffled song.
    // Shuffle stays ON, so later song-end jumps remain shuffled too.
    if(!wasOn){
      setTimeout(()=>{
        goToNextSongAndPlaySpotify();
      },150);
    }
  }else{
    suffleBag=[];
  }
}

/* ===== AUTO NEXT SONG WHEN LAST LRC TIMETAG IS REACHED ===== */
let autoNextSongArmed = false;
let autoNextSongLastChapter = -1;

function getCurrentSongEndTime(){
  const c=chapters[idx];
  if(!c) return null;
  const parsed=parseLRC(c.lyrics||'');
  if(!parsed.length) return null;

  // Use the final LRC timestamp as the known end marker.
  // Add a small grace period so the last line can be seen/heard.
  return parsed[parsed.length-1].time + 15.0;
}

function launchCurrentSongInSpotify(){
  const c=chapters[idx];
  if(!c) return;

  // loadCurrentSpotify() has already updated this exact ID for the new page.
  const id=(spotifyAppBtn && spotifyAppBtn.dataset)
    ? (spotifyAppBtn.dataset.spotifyId || '')
    : '';

  if(id){
    try{
      if(window.AndroidSpotify && AndroidSpotify.openTrack){
        AndroidSpotify.openTrack(id);
        return;
      }
    }catch(e){}

    // Desktop/Windows: open Spotify Web in the browser.
    // Android without the native bridge can still use the Spotify URI.
    const isAndroid=/Android/i.test(navigator.userAgent||'');
    if(!isAndroid){
      window.open('https://open.spotify.com/track/'+encodeURIComponent(id),'_blank','noopener');
    }else{
      window.location.href='spotify:track:'+id;
    }
    return;
  }

  // If this song has no saved Spotify ID, use the exact song search.
  const q=spotifyQueryFromChapter(c);
  try{
    if(window.AndroidSpotify && AndroidSpotify.searchSong){
      AndroidSpotify.searchSong(q);
      return;
    }
  }catch(e){}

  const isAndroid=/Android/i.test(navigator.userAgent||'');
  if(!isAndroid){
    window.open('https://open.spotify.com/search/'+encodeURIComponent(q),'_blank','noopener');
  }else{
    window.location.href='spotify:search:'+encodeURIComponent(q);
  }
}

function goToNextSongAndPlaySpotify(){
  if(!chapters || !chapters.length) return;

  const keepLyrics = !!keepLyricsAcrossSongs;
  const nextIndex = getNextSongIndex();

  try{
    manualLineMode=false;
    artworkTimerRunning=false;
  }catch(e){}

  showChapter(nextIndex);
  removeCurrentFromSuffleBag();

  autoNextSongArmed=false;

  setTimeout(()=>{
    launchCurrentSongInSpotify();

    // New Spotify track starts from 00:00.
    artworkTimerStartMs=performance.now();
    artworkTimerRunning=true;
    autoNextSongArmed=true;
    ensureAndroidLyricsLoop();

    if(keepLyrics){
      automaticLyricsMode=true;
      keepLyricsAcrossSongs=true;
      notifyAndroidLyricsButton(true);

      textMode='lyrics';
      showSynchronizedLyrics(chapters[idx]);
      syncLyricsAt(0);
    }else{
      automaticLyricsMode=false;
      notifyAndroidLyricsButton(false);
    }
  },1200);
}

function checkAutoNextSong(songTime){
  const endTime=getCurrentSongEndTime();
  if(endTime===null) return;

  // Re-arm whenever we are safely before the final timestamp.
  if(songTime < endTime-1.5){
    autoNextSongArmed=true;
  }

  if(autoNextSongArmed && songTime >= endTime){
    autoNextSongArmed=false;
    goToNextSongAndPlaySpotify();
  }
}

function showChapter(i){
  if(lyricsSyncTimer){ clearInterval(lyricsSyncTimer); lyricsSyncTimer=null; }
  idx=Math.max(0,Math.min(chapters.length-1,i));
  const c=chapters[idx], s=schemeFor(idx);
  bgEl.style.background=s.bg;
  titleEl.style.color=s.text;
  textEl.style.color=s.text;
  titleEl.textContent=c.title;
  textMode='song';
  textEl.classList.remove('lyrics-mode');
  currentLyrics=[];
  currentLyricsChapter=null;
  activeLyricIndex=-1;
  textEl.textContent=c.text;
  textEl.scrollTop=0;
  capEl.textContent=c.caption||'';
  noEl.textContent=`${idx+1} / ${chapters.length}`;
  updateChapterMenuActive();
  bar.style.width='0%';
  requestAnimationFrame(positionChapterLayout);
  loadCurrentSpotify(c);
  // No automatic TTS. Speech only happens from the TTS button.
}

document.getElementById('prevBtn').onclick=()=>{showChapter(idx-1);};
document.getElementById('nextBtn').onclick=()=>{showChapter(idx+1);};

  if(!speak)ttsEnabled=false;

  ttsEnabled=was;
}

<script>
/* WINDOWS/DESKTOP: Spotify Web only. Android keeps native Spotify app behavior. */
(function(){
  const isAndroid = /Android/i.test(navigator.userAgent || '');
  if(isAndroid) return;

  function spotifyWebFromHref(href){
    if(!href) return null;
    const track = href.match(/^spotify:track:([A-Za-z0-9]+)$/i);
    if(track) return 'https://open.spotify.com/track/' + encodeURIComponent(track[1]);
    const search = href.match(/^spotify:search:(.*)$/i);
    if(search) return 'https://open.spotify.com/search/' + encodeURIComponent(decodeURIComponent(search[1] || ''));
    return null;
  }

  document.addEventListener('click', function(e){
    const a = e.target.closest && e.target.closest('a');
    if(!a) return;
    const web = spotifyWebFromHref(a.getAttribute('href') || '');
    if(web){
      e.preventDefault();
      e.stopImmediatePropagation();
      window.open(web, '_blank', 'noopener');
    }
  }, true);

  window.addEventListener('DOMContentLoaded', function(){
    const artwork = document.getElementById('spotifyArtworkLink');
    if(artwork){
      const web = spotifyWebFromHref(artwork.getAttribute('href') || '');
      if(web){
        artwork.href = web;
        artwork.target = '_blank';
        artwork.rel = 'noopener';
      }
    }
  });
})();
</script>


<script>
/* FINAL WINDOWS RULE: open exact Spotify Web track: https://open.spotify.com/track/ + id */
(function(){
  const isAndroid = /Android/i.test(navigator.userAgent || '');
  if(isAndroid) return;

  function currentSpotifyId(){
    const btn = document.getElementById('spotifyAppBtn');
    if(btn && btn.dataset && btn.dataset.spotifyId) return btn.dataset.spotifyId;

    const art = document.getElementById('spotifyArtworkLink');
    if(art){
      const href = art.getAttribute('href') || '';
      let m = href.match(/spotify:track:([A-Za-z0-9]+)/i);
      if(m) return m[1];
      m = href.match(/open\.spotify\.com\/track\/([A-Za-z0-9]+)/i);
      if(m) return m[1];
    }
    return '';
  }

  function currentTrackUrl(){
    const id = currentSpotifyId();
    return id ? 'https://open.spotify.com/track/' + encodeURIComponent(id)
              : 'https://open.spotify.com/';
  }

  document.addEventListener('click', function(e){
    const el = e.target.closest && e.target.closest(
      '#spotifyArtworkLink,#spotifyAppBtn,#spotifyWebBtn'
    );
    if(!el) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    window.open(currentTrackUrl(), '_blank', 'noopener');
  }, true);
})();
</script>








<script>

  const voiceBtn=document.getElementById('desktopVoiceBtn');
  const shuffleBtn=document.getElementById('desktopShuffleBtn');
  if(!bar || !lyricsBtn || !voiceBtn || !shuffleBtn) return;

  function refreshDesktopBar(){
    try{ lyricsBtn.classList.toggle('on', !!automaticLyricsMode); }catch(e){}
    try{ voiceBtn.classList.toggle('on', !!alloyEnabled); }catch(e){}
    try{ shuffleBtn.classList.toggle('on', !!suffleMode); }catch(e){}
  }

  lyricsBtn.addEventListener('click', function(){
    try{ setAutomaticLyricsMode(!automaticLyricsMode); }catch(e){}
    refreshDesktopBar();
  });

  voiceBtn.addEventListener('click', function(){
    const real=document.getElementById('alloyBtn');
    if(real) real.click();
    refreshDesktopBar();
  });

  shuffleBtn.addEventListener('click', function(){
    try{ setSuffleMode(!suffleMode); }catch(e){}
    refreshDesktopBar();
  });

  setInterval(refreshDesktopBar,500);
  refreshDesktopBar();
})();
</script>
